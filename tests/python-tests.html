<!doctype html>
<!-- Tests du runtime Python avec le vrai Pyodide : module pywims, espaces de noms et questions du dépôt.
     Ils téléchargent Pyodide et SymPy : compter une à deux minutes. -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Tests du runtime Python PyWimsOnHTML</title>
</head>
<body>
  <h1>Tests du runtime Python</h1>
  <p id="progress">Chargement de Pyodide…</p>
  <ol id="results"></ol>
  <script src="../runtime/template.js"></script>
  <script src="../runtime/correction.js"></script>
  <script src="../compiler/format.js"></script>
  <script src="../compiler/draws.js"></script>
  <script src="../compiler/assemble.js"></script>
  <script src="../compiler/zip.js"></script>
  <script src="../compiler/compiler.js"></script>
  <script src="../runtime/python.js"></script>
  <script>
    const results = document.getElementById("results");
    // Exécute un contrôle asynchrone ; un échec n’interrompt pas les suivants.
    async function test(name, callback) {
      const item = document.createElement("li");
      try {
        await callback();
        item.textContent = `RÉUSSI : ${name}`;
      } catch (error) {
        item.textContent = `ÉCHEC : ${name} — ${error.message}`;
        item.style.color = "red";
      }
      results.append(item);
    }

    // Évalue une condition Python dans une session et échoue avec le message donné si elle est fausse.
    async function expectPython(session, condition, message) {
      if (!await session.getBoolean(condition)) {
        throw new Error(`${message} (${condition})`);
      }
    }

    // Nombre de tirages du balayage de chaque question : 20 par défaut, ?tirages=200 pour un balayage
    // complet (quelques minutes).
    const sweepCount = Number(new URLSearchParams(location.search).get("draws")) || 20;

    // Toutes les questions de la racine de questions/ et les modèles du mode d’emploi (guide/templates/),
    // vérifiés de la même façon (SPECIFICATION.md, § 11.5), d’après la liste que le serveur de test
    // (python -m http.server) affiche pour un dossier : une nouvelle question est testée sans modifier
    // cette page. Chemins relatifs à la racine du projet.
    async function listQuestionFiles() {
      const files = [];
      for (const folder of ["questions/", "guide/templates/"]) {
        const listing = new DOMParser().parseFromString(await (await fetch(`../${folder}`)).text(), "text/html");
        files.push(...[...listing.querySelectorAll("a[href]")]
          .map(link => decodeURIComponent(link.getAttribute("href")))
          .filter(name => name.toLowerCase().endsWith(".pwq"))
          .sort((a, b) => a.localeCompare(b, "fr"))
          .map(name => `${folder}${name}`));
      }
      return files;
    }

    (async () => {
      // Le module pywims et le script du Worker viennent du projet, comme dans le compilateur.
      const moduleSource = await (await fetch("../runtime/pywims.py", { cache: "no-store" })).text();
      const workerSource = await (await fetch("../runtime/python-worker.js", { cache: "no-store" })).text();
      PyWimsPython.setWorkerSource(workerSource);
      await PyWimsPython.setModuleSource(moduleSource);
      const questionFiles = await listQuestionFiles();

      await test("chaque outil exporté par pywims est un nom de champ réservé", async () => {
        const session = PyWimsPython.createSession("exports");
        await session.initialize("import pywims");
        const exported = JSON.parse(await session.run("__import__('json').dumps(__import__('pywims').__all__)"));
        const missing = exported.filter(name => !PyWimsTemplate.reservedNames.has(name));
        if (!exported.length || missing.length) {
          throw new Error(`Noms à ajouter à reservedNames dans runtime/template.js : ${missing.join(", ")}`);
        }
        await session.dispose();
      });

      await test("un module pywims modifié remplace l’ancien sans recharger la page", async () => {
        await PyWimsPython.setModuleSource(`${moduleSource}\nMARQUE_ESSAI = 1\n`);
        const session = PyWimsPython.createSession("module-modifie");
        await session.initialize("import pywims");
        await expectPython(session, "getattr(__import__('pywims'), 'MARQUE_ESSAI', None) == 1", "Le module modifié n’est pas importé");
        await session.dispose();
        await PyWimsPython.setModuleSource(moduleSource);
        const restored = PyWimsPython.createSession("module-restaure");
        await restored.initialize("import pywims");
        await expectPython(restored, "not hasattr(__import__('pywims'), 'MARQUE_ESSAI')", "Le module d’origine n’est pas rétabli");
        await restored.dispose();
      });

      // Le premier import de SymPy (plusieurs secondes, plus de 30 s sur un navigateur lent) ne doit
      // pas compter dans le temps limité de « question_setup » : il est fait à l’initialisation.
      await test("les bibliothèques de la question sont importées à l’initialisation, hors du temps limité", async () => {
        const session = PyWimsPython.createSession("import-initial");
        await session.initialize("from sympy import Rational\nimport fractions");
        await expectPython(session, "all(m in __import__('sys').modules for m in ('sympy', 'fractions'))",
          "SymPy n’est pas importé avant l’exécution de « question_setup »");
        await session.dispose();
      });

      await test("un script du Worker modifié relance le moteur, le même script ne le relance pas", async () => {
        const before = PyWimsPython.epoch();
        PyWimsPython.setWorkerSource(workerSource);
        if (PyWimsPython.epoch() !== before) throw new Error("Le même script a relancé le moteur.");
        PyWimsPython.setWorkerSource(`${workerSource}\n// essai\n`);
        if (PyWimsPython.epoch() !== before + 1) throw new Error("Un script modifié n’a pas relancé le moteur.");
        PyWimsPython.setWorkerSource(workerSource);
        const session = PyWimsPython.createSession("worker-relance");
        await session.initialize("x = 1");
        await expectPython(session, "1 + 1 == 2", "Python ne marche plus après le changement de script");
        await session.dispose();
      });

      await test("le module pywims analyse les saisies et refuse tout autre code", async () => {
        const session = PyWimsPython.createSession("module");
        await session.initialize("from pywims import py_wims, is_number, math_expression\nfrom sympy import *");
        await session.run("from pywims import py_wims, is_number, math_expression\nfrom sympy import *\nx = symbols('x')");
        await expectPython(session, "math_expression('3x^2+2x') == 3*x**2 + 2*x", "Produit implicite et puissance mal lus");
        await expectPython(session, "math_expression('sqrt(4)+e') == 2 + E", "Fonctions ou constantes mal lues");
        await expectPython(session, "math_expression(\"__import__('os')\") is None", "Une saisie dangereuse a été acceptée");
        await expectPython(session, "math_expression('3+') is None", "Une expression incomplète a été acceptée");
        await expectPython(session, "math_expression('sin x + sqrt 2') == sin(x) + sqrt(2)", "Fonction sans parenthèses mal lue");
        await expectPython(session, "math_expression('ln(x) + ln 2') == log(x) + log(2)", "ln mal lu");
        await expectPython(session, "math_expression('1.5x') == Rational(3, 2)*x", "Décimal non converti en fraction");
        await expectPython(session, "math_expression('(x+1)(x-1)') == (x + 1)*(x - 1)", "Produit de parenthèses mal lu");
        await expectPython(session,
          "all(math_expression(s) is None for s in ['x//2', 'x.diff(x)', '(x).diff(x)', 'x or y', 'not x', '[x]', '1,5', ''])",
          "Une saisie hors de l’écriture mathématique a été acceptée");
        await expectPython(session, "simplify(py_wims('1/2') - Rational(1, 2)) == 0", "py_wims ne lit pas une fraction");
        await expectPython(session, "py_wims('(') is None", "py_wims accepte une saisie invalide");
        await expectPython(session, "is_number(Rational(1, 2)) and is_number(3) and not is_number(x)", "is_number se trompe");
      });

      await test("l’espace de noms de l’auteur est vierge et ne perturbe pas pywims", async () => {
        const session = PyWimsPython.createSession("isolation");
        await session.initialize("from pywims import math_expression");
        await expectPython(session, "'randint' not in globals() and 'Rational' not in globals() and 'py_wims' not in globals()",
          "Des noms sont importés à la place de l’auteur");
        await session.run("from pywims import math_expression\nE = 3\nRational = None\nSymbol = None");
        await expectPython(session, "str(math_expression('e + x')) == 'x + E'", "Une variable de l’auteur a modifié l’analyse");
        await session.getTemplateValue("E");
        await expectPython(session, "'pywims' not in globals()", "Le module a été ajouté à l’espace de noms de l’auteur");
      });

      await test("deux questions partagent Pyodide sans partager leurs variables", async () => {
        const first = PyWimsPython.createSession("question-a");
        const second = PyWimsPython.createSession("question-b");
        await Promise.all([first.initialize("x = 1"), second.initialize("x = 2")]);
        await first.run("x = 1\nok_answer['x'] = True");
        await second.run("x = 2");
        await expectPython(first, "x == 1 and ok_answer == {'x': True}", "La première question a été modifiée");
        await expectPython(second, "x == 2 and ok_answer == {}", "La seconde question voit les variables de la première");
      });

      await test("les valeurs affichées sont converties en LaTeX ou en texte", async () => {
        const session = PyWimsPython.createSession("affichage");
        await session.initialize("import sympy");
        await session.run("import sympy\nn = 3\nnom = 'Ada'\nM = sympy.Matrix([[1, 2], [3, 4]])\nf = sympy.Rational(3, 4)");
        const values = await Promise.all(["n", "nom", "M", "f"].map(name => session.getTemplateValue(name)));
        // Pas de \displaystyle ajouté d’office : l’auteur choisit la taille des formules.
        if (values[0] !== "3" || values[1] !== "Ada" ||
            !values[2].startsWith("\\left[\\begin{matrix}1 & 2") ||
            values[3] !== "\\frac{3}{4}") {
          throw new Error(`Valeurs inattendues : ${JSON.stringify(values)}`);
        }
        let rejected = false;
        try {
          await session.getTemplateValue("absente");
        } catch (error) {
          rejected = error.message.includes("Variable de question inconnue : absente");
        }
        if (!rejected) throw new Error("Une variable absente n’est pas signalée clairement.");
      });

      await test("les solutions sont converties en saisie d’élève, avec ANY pour les valeurs quelconques", async () => {
        const session = PyWimsPython.createSession("solutions");
        await session.initialize("from sympy import *\nfrom pywims import ANY");
        await session.run("from sympy import *\nfrom pywims import ANY\nx = symbols('x')");
        const converted = JSON.parse(await session.run(`
import json
_pw = __import__("pywims")
json.dumps({
  "fraction": _pw._solution_text(Rational(19, 12)),
  "expression": _pw._solution_text(x**2 + 2*x),
  "entier": _pw._solution_text(7),
  "libre": _pw._solution_text(ANY),
  "latex": _pw._solution_latex(3*x**2 - 1),
  "cases": _pw._solution_cells(Matrix(2, 2, lambda i, j: 0 if i > j else ANY)),
  "liste": _pw._solution_cells([[1, x], [Rational(1, 2), 0]]),
  "flottants": [_pw._solution_text(v) for v in (0.1 + 0.2, 2.0, -0.0, 1e-05, Float(2) / 3)],
  "texte": _pw._solution_text("0,3")
})`));
        const expected = {
          fraction: "19/12",
          expression: "x^2 + 2*x",
          entier: "7",
          libre: null,
          latex: "3 x^{2} - 1",
          cases: [[null, null], ["0", null]],
          liste: [["1", "x"], ["1/2", "0"]],
          // Arrondi à 12 chiffres significatifs, sans exposant ni zéros finaux (SPECIFICATION.md § 2.6).
          flottants: ["0.3", "2", "0", "0.00001", "0.666666666667"],
          texte: "0,3"
        };
        if (JSON.stringify(converted) !== JSON.stringify(expected)) {
          throw new Error(`Conversion inattendue : ${JSON.stringify(converted)}`);
        }
      });

      await test("la saisie d’un champ à choix arrive en Python comme un entier, None ou une vraie liste", async () => {
        const session = PyWimsPython.createSession("choix");
        await session.initialize("from sympy import Rational");
        await session.run("from sympy import Rational\nchoix = ['$2$', Rational(1, 2)]");
        await session.setChoice("unique", 1);
        await session.setChoice("aucun", null);
        await session.setChoice("multiple", [0, 1]);
        await session.setChoice("vide", []);
        await expectPython(session,
          "unique == 1 and aucun is None and type(multiple) is list and multiple == [0, 1] and vide == []",
          "Saisie mal transmise");
        const texts = await session.getChoiceTexts("choix");
        if (JSON.stringify(texts) !== JSON.stringify(["$2$", "\\(\\frac{1}{2}\\)"])) {
          throw new Error(`Textes des choix inattendus : ${JSON.stringify(texts)}`);
        }
        for (const value of [-1, 1.5, "1", [0, "1"]]) {
          let rejected = false;
          try {
            await session.setChoice("x", value);
          } catch {
            rejected = true;
          }
          if (!rejected) throw new Error(`Saisie invalide acceptée : ${JSON.stringify(value)}`);
        }
      });

      for (const file of questionFiles) {
        await test(`la question ${file} s’exécute et fournit les variables de son énoncé`, async () => {
          const response = await fetch(`../${file}`);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const fields = PyWimsCompiler.parseQuestionSource(await response.text(), file);
          const session = PyWimsPython.createSession(file.replace(/\W/g, "_"));
          await session.initialize(`${fields.question_setup}\n${fields.question_check ?? ""}`);
          await session.run(fields.question_setup);
          const names = [...PyWimsTemplate.templateVariables(fields.question_statement)];
          const values = await Promise.all(names.map(name => session.getTemplateValue(name)));
          if (values.some(value => typeof value !== "string" || !value.trim())) {
            throw new Error(`Valeurs vides : ${JSON.stringify(Object.fromEntries(names.map((n, i) => [n, values[i]])))}`);
          }
          // Solution d’un champ convertie par le module, en expression Python (texte JSON) ; pour un
          // champ à choix, indice ou liste d’indices, contrôlés avec le nombre de choix.
          const solutionJson = tag => {
            const variable = tag.attributes.solution;
            const converter = tag.type === "input_math" ? "_solution_latex"
              : tag.type === "input_text" ? "_solution_text" : "_solution_cells";
            const call = PyWimsTemplate.choiceTypes.has(tag.type)
              ? `_choice_solution(${variable}, ${tag.type === "input_checkbox" ? "True" : "False"}, ` +
                `len(__import__("pywims")._choice_texts(${tag.attributes.choices})))`
              : `${converter}(${variable})`;
            return `__import__("json").dumps(__import__("pywims").${call})`;
          };
          // Chaque champ désigne une variable de « question_setup » que le module sait convertir.
          for (const tag of PyWimsTemplate.parseTags(fields.question_statement)) {
            const variable = tag.attributes.solution;
            const converted = await session.run(solutionJson(tag));
            if (!converted || converted === "null") {
              throw new Error(`Solution « ${variable} » du champ « ${tag.name} » inutilisable : ${converted}`);
            }
          }

          // Sans « question_check », la correction par défaut est en JavaScript : la question compilée, testée
          // plus bas, la vérifie dans la page générée. Ici, « question_setup » et les solutions suffisent.
          if (fields.question_check === undefined) return;

          // Saisit la solution comme un élève (texte ASCII, « 1 » pour une case libre), puis corrige.
          for (const tag of PyWimsTemplate.parseTags(fields.question_statement)) {
            const variable = tag.attributes.solution;
            if (PyWimsTemplate.choiceTypes.has(tag.type)) {
              await session.setChoice(tag.name, JSON.parse(await session.run(solutionJson(tag))));
            } else if (tag.type === "input_text" || tag.type === "input_math") {
              await session.set(tag.name, await session.run(`__import__("pywims")._solution_text(${variable})`));
            } else {
              const cells = JSON.parse(await session.run(
                `__import__("json").dumps(__import__("pywims")._solution_cells(${variable}))`
              ));
              await session.setMatrix(tag.name, cells.map(row => row.map(cell => cell ?? "1")));
            }
          }
          await session.resetAnswers();
          await session.run(fields.question_check);
          const verdict = JSON.parse(await session.run(
            `__import__("json").dumps({"ok": {k: bool(v) for k, v in ok_answer.items()}, "feedback": str(feedback)})`
          ));
          if (!Object.keys(verdict.ok).length || !Object.values(verdict.ok).every(Boolean)) {
            throw new Error(`La solution n’est pas jugée juste : ${JSON.stringify(verdict)}`);
          }
          if (!verdict.feedback.startsWith("Bravo")) {
            throw new Error(`Retour inattendu pour la solution : ${verdict.feedback}`);
          }
        });
      }

      // Tirages calculés par le compilateur (étape 4a).
      const questionFields = {};
      for (const file of questionFiles) {
        const response = await fetch(`../${file}`);
        // Clé : le nom du fichier, que des tests ci-dessous désignent (« pgcd.pwq »).
        questionFields[file.split("/").pop()] = PyWimsCompiler.parseQuestionSource(await response.text(), file);
      }

      await test("le compilateur calcule des tirages complets et distincts pour chaque question", async () => {
        for (const [file, fields] of Object.entries(questionFields)) {
          const draws = await PyWimsCompiler.computeDraws(fields, { count: 10 });
          const variables = [...new Set([
            ...PyWimsTemplate.templateVariables(fields.question_statement),
            ...PyWimsTemplate.templateVariables(fields.question_solution_explanation ?? "")
          ])].sort().join(",");
          const names = PyWimsTemplate.parseTags(fields.question_statement).map(tag => tag.name).sort().join(",");
          // Mêmes éléments que la fusion du compilateur : deux tirages d’un QCM peuvent avoir le même
          // énoncé et la même solution, et ne différer que par leurs choix ou leur ordre.
          const keys = new Set(draws.map(draw =>
            JSON.stringify([draw.context, draw.solutions, draw.choices, draw.orders])));
          if (!draws.length || keys.size !== draws.length ||
              draws.some(draw => Object.keys(draw.context).sort().join(",") !== variables ||
                Object.keys(draw.solutions).sort().join(",") !== names)) {
            throw new Error(`${file} : tirages incomplets ou en double (${draws.length})`);
          }
        }
        const triangular = await PyWimsCompiler.computeDraws(questionFields["matrice-triangulaire.pwq"], { count: 3 });
        const cells = triangular[0].solutions.matrix;
        if (cells[0][0] !== null || cells.at(-1)[0] !== "0") {
          throw new Error(`Solution libre inattendue : ${JSON.stringify(triangular[0])}`);
        }
      });

      // Balayage : computeDraws exécute chaque tirage deux fois, convertit ses solutions, les saisit
      // comme un élève et exige qu’elles soient jugées justes (SPECIFICATION.md, §§ 3 et 8).
      await test(`balayage de ${sweepCount} tirages par question : contrôles, intégration au fichier et relecture`, async () => {
        const sizes = [];
        for (const [file, fields] of Object.entries(questionFields)) {
          document.getElementById("progress").textContent = `Balayage : ${file}…`;
          const draws = await PyWimsCompiler.computeDraws(fields, { count: sweepCount }).catch(error => {
            throw new Error(`${file} : ${error.message}`);
          });
          const html = PyWimsCompiler.renderDrawData(draws);
          const host = document.createElement("div");
          host.innerHTML = html;
          if (JSON.stringify(JSON.parse(host.querySelector("pre[data-draws]").textContent)) !== JSON.stringify(draws)) {
            throw new Error(`${file} : les tirages relus diffèrent.`);
          }
          sizes.push(`${file.replace(".pwq", "")} ${draws.length} tirages, ${(html.length / 1024).toFixed(1)} Ko`);
        }
        document.getElementById("progress").dataset.sizes = sizes.join(" ; ");
        console.log(`Taille des tirages : ${sizes.join(" ; ")}`);
      });

      await test("les tirages sont reproductibles et les doublons sont fusionnés", async () => {
        const fields = questionFields["pgcd.pwq"];
        const first = JSON.stringify(await PyWimsCompiler.computeDraws(fields, { count: 5 }));
        const second = JSON.stringify(await PyWimsCompiler.computeDraws(fields, { count: 5 }));
        if (first !== second) throw new Error("Deux compilations donnent des tirages différents.");
        const fixed = await PyWimsCompiler.computeDraws({
          question_setup: "valeur = 4",
          question_statement: "Combien vaut {{ valeur }} ? {% input_text 'r' solution=valeur %}",
          question_check: "ok_answer['r'] = r == '4'"
        }, { count: 5 });
        if (fixed.length !== 1 || fixed[0].solutions.r !== "4") {
          throw new Error(`Une question sans hasard devrait donner un seul tirage : ${JSON.stringify(fixed)}`);
        }
        // Le champ « question_draws » fixe le nombre de graines essayées : ici 3 (graines 0 à 2).
        const three = await PyWimsCompiler.computeDraws({ ...fields, question_draws: "3" });
        if (!three.length || three.length > 3 || three.some(draw => draw.seed > 2)) {
          throw new Error(`Le champ « question_draws » n’est pas respecté : graines ${three.map(draw => draw.seed)}`);
        }
      });

      await test("decimal_comma écrit un nombre arrondi à la française, sans zéros finaux", async () => {
        const session = PyWimsPython.createSession("decimal-fr");
        await session.initialize("from sympy import *\nfrom pywims import decimal_comma");
        await session.run("from sympy import *\nfrom pywims import decimal_comma");
        const written = JSON.parse(await session.run(`__import__("json").dumps([
  decimal_comma(sqrt(2), 2), decimal_comma(1.5, 2), decimal_comma(2, 2), decimal_comma(2.675, 2),
  decimal_comma(-0.001, 2), decimal_comma(pi, 4), decimal_comma(Rational(1, 3), 3), decimal_comma(10**30, 2)])`));
        // 2.675 donne 2,68 : l’arrondi porte sur l’écriture décimale, et non sur le flottant binaire.
        const expected = ["1,41", "1,5", "2", "2,68", "0", "3,1416", "0,333", "1000000000000000000000000000000"];
        if (JSON.stringify(written) !== JSON.stringify(expected)) {
          throw new Error(`Écritures inattendues : ${JSON.stringify(written)}`);
        }
        for (const call of ["decimal_comma(symbols('x'), 2)", "decimal_comma(1.5, -1)", "decimal_comma('1,5', 1)"]) {
          let rejected = false;
          try {
            await session.run(call);
          } catch (error) {
            rejected = error.message.includes("TypeError");
          }
          if (!rejected) throw new Error(`Appel accepté à tort : ${call}`);
        }
        await session.dispose();
      });

      await test("une question sans « question_check » se compile et se corrige par défaut", async () => {
        const mcq = await PyWimsCompiler.computeDraws({
          question_setup: "from random import sample\nnombres = sample(range(2, 30), 3)\nchoix = [str(n) for n in nombres]\nbonne = 0",
          question_statement: "Lequel est le premier tiré ? {% input_radio 'r' choices=choix solution=bonne %}"
        }, { count: 3 });
        const decimal = await PyWimsCompiler.computeDraws({
          question_setup: "from pywims import decimal_comma\nprix = 12.5 * 0.8\nracine = decimal_comma(2 ** 0.5, 2)\nsomme = 0.1 + 0.2",
          question_statement: "{% input_text 'a' solution=prix %} {% input_text 'b' solution=racine %} {% input_text 'c' solution=somme %}"
        }, { count: 1 });
        if (mcq.length < 2 || mcq.some(draw => draw.solutions.r !== 0) ||
            JSON.stringify(decimal[0].solutions) !== JSON.stringify({ a: "10", b: "1,41", c: "0.3" })) {
          throw new Error(`Tirages inattendus : ${JSON.stringify([mcq, decimal])}`);
        }
        for (const [fields, fragment] of [
          [{ question_setup: "from sympy import symbols\nx = symbols('x')\nd = 2*x",
             question_statement: "{% input_math 'm' solution=d %}" }, "Le champ « m » (input_math) exige un « question_check »"],
          [{ question_setup: "s = '  '", question_statement: "{% input_text 'r' solution=s %}" },
            "Graine 0 : la solution du champ « r » est vide"],
          [{ question_setup: "M = [['1', ''], ['0', '2']]", question_statement: "{% input_matrix 'm' size=2 solution=M %}" },
            "la solution du champ « m » (case [0][1]) est vide"]
        ]) {
          let message = "";
          try {
            await PyWimsCompiler.computeDraws(fields, { count: 1 });
          } catch (error) {
            message = error.message;
          }
          if (!message.includes(fragment)) throw new Error(`Message « ${message} » sans : ${fragment}`);
        }
      });

      await test("le hachage des chaînes est fixe : l’ordre d’un set de chaînes ne dépend pas du chargement", async () => {
        const session = PyWimsPython.createSession("hachage");
        await session.initialize("import sys");
        // Valeur de hash("abc") avec PYTHONHASHSEED=0 sur Pyodide 0.27.7 (wasm32), mesurée sur
        // plusieurs chargements ; sans la variable, elle change à chaque chargement.
        await expectPython(session, "__import__('sys').flags.hash_randomization == 0 and hash('abc') == -1600925533",
          "Pyodide n’a pas été lancé avec PYTHONHASHSEED=0");
        await session.dispose();
      });

      await test("un champ à choix enregistre ses choix, sa solution et un ordre mélangé par tirage", async () => {
        const draws = await PyWimsCompiler.computeDraws({
          question_setup: "from sympy import Rational\nchoix = ['$2$', Rational(1, 2), 'pair', 'Aucun de ces nombres']\nbonnes = [2, 0]",
          question_statement: "Lesquels ? {% input_checkbox 'r' choices=choix solution=bonnes fixed_last=1 %}",
          // « bonnes » n’est pas croissante, alors que la saisie l’est : on compare les listes triées.
          question_check: "ok_answer['r'] = r == sorted(bonnes)"
        }, { count: 20 });
        const [draw] = draws;
        if (JSON.stringify(draw.choices.r) !== JSON.stringify(["$2$", "\\(\\frac{1}{2}\\)", "pair", "Aucun de ces nombres"]) ||
            draw.solutions.r.join() !== "0,2" ||
            draws.some(other => other.orders.r.at(-1) !== 3 || [...other.orders.r].sort().join() !== "0,1,2,3")) {
          throw new Error(`Tirage inattendu : ${JSON.stringify(draw)}`);
        }
        // Sans hasard dans « question_setup », seuls les ordres distinguent les tirages : 3! = 6 au plus.
        if (draws.length < 2 || draws.length > 6) {
          throw new Error(`Les ordres mélangés devraient donner de 2 à 6 tirages : ${draws.length}`);
        }
        const [radio] = await PyWimsCompiler.computeDraws({
          question_setup: "from sympy import Integer\nchoix = ['oui', 'non']\nbonne = Integer(1)",
          question_statement: "{% input_radio 'r' choices=choix solution=bonne %}",
          question_check: "ok_answer['r'] = r == bonne"
        }, { count: 1 });
        if (radio.solutions.r !== 1) throw new Error(`Solution d’un choix unique inattendue : ${JSON.stringify(radio)}`);
      });

      await test("les erreurs de l’auteur sont signalées avec leur graine et leur cause", async () => {
        const cases = [
          [{ question_setup: "a = 1\nb = 1 / 0", question_statement: "{% input_text 'r' solution=a %}" },
            ["graine 0", "ligne 2", "ZeroDivisionError"]],
          [{ question_setup: "a = 1", question_statement: "{% input_text 'r' solution=absente %}" },
            ["La solution « absente » du champ « r » n’est pas définie par « question_setup »."]],
          [{ question_setup: "r = 1", question_statement: "{% input_text 'r' solution=r %}" },
            ["Le champ « r » porte le nom d’une variable de « question_setup »"]],
          [{ question_setup: "from sympy import eye\nM = eye(3)", question_statement: "{% input_matrix 'm' size=2 solution=M %}" },
            ["est une matrice 3 × 3, alors que le champ est 2 × 2"]],
          [{ question_setup: "from sympy import eye\nM = eye(2)", question_statement: "{% input_text 'r' solution=M %}" },
            ["doit être une valeur simple, pas une matrice"]],
          [{ question_setup: "n = 1.5\nM = [[1]]", question_statement: "{% input_matrix 'm' size=n solution=M %}" },
            ["La dimension « n » doit être un entier"]],
          [{ question_setup: "a = 1", question_statement: "{{ inconnue }} {% input_text 'r' solution=a %}" },
            ["La variable « inconnue » de l’énoncé ou de l’explication n’est pas définie"]],
          [{ question_setup: "a = 1", question_statement: "{% input_text 'r' solution=a %}",
             question_solution_explanation: "Car {{ absente }}." },
            ["La variable « absente » de l’énoncé ou de l’explication n’est pas définie"]],
          [{ question_setup: "s = 0", question_statement: "{% input_radio 'r' choices=absents solution=s %}" },
            ["Les choix « absents » du champ « r » ne sont pas définis par « question_setup »."]],
          [{ question_setup: "c = 'ab'\ns = 0", question_statement: "{% input_radio 'r' choices=c solution=s %}" },
            ["Les choix « c » du champ « r » : ce doit être une liste d’au moins deux choix."]],
          [{ question_setup: "c = ['a', 'b']\ns = 2", question_statement: "{% input_radio 'r' choices=c solution=s %}" },
            ["La solution « s » du champ « r » : 2 n’est pas un indice de choix (de 0 à 1)."]],
          [{ question_setup: "c = ['a', 'b']\ns = [0]", question_statement: "{% input_radio 'r' choices=c solution=s %}" },
            ["ce doit être l’indice du bon choix, pas une liste"]],
          [{ question_setup: "c = ['a', 'b']\ns = 0", question_statement: "{% input_checkbox 'r' choices=c solution=s %}" },
            ["ce doit être la liste des indices des bons choix"]],
          [{ question_setup: "c = ['a', 'b']\ns = [1, 1]", question_statement: "{% input_checkbox 'r' choices=c solution=s %}" },
            ["un indice de choix est répété"]],
          [{ question_setup: "c = ['a', 'b']\ns = [True]", question_statement: "{% input_checkbox 'r' choices=c solution=s %}" },
            ["True n’est pas un indice de choix"]],
          [{ question_setup: "c = ['a', 'b']\ns = []", question_statement: "{% input_checkbox 'r' choices=c solution=s fixed_last=2 %}" },
            ["fixed_last=2 doit être inférieur au nombre de choix (2) du champ « r »"]],
          // Formule TeX dans une chaîne ordinaire : « \frac » contient un saut de page, « \times » une tabulation.
          [{ question_setup: "a = 1\nt = '$\\frac{1}{2}$'", question_statement: "{% input_text 'r' solution=a %}" },
            ["« question_setup », ligne 2 : une chaîne contient un caractère de contrôle (\\f)", "r'…'"]],
          [{ question_setup: "a = 1", question_statement: "{% input_text 'r' solution=a %}",
             question_check: "ok_answer['r'] = True\nfeedback = f'{a} $\\times$ 2'" },
            ["« question_check », ligne 2", "(\\t)"]],
          // Cohérence : la solution saisie comme par un élève doit être jugée juste par « question_check ».
          [{ question_setup: "a = 1", question_statement: "{% input_text 'r' solution=a %}",
             question_check: "ok_answer['r'] = r == '2'\nfeedback = 'Ce n’est pas 2.'" },
            ["Graine 0 : la solution du champ « r » est jugée fausse par « question_check ».", "Retour obtenu : « Ce n’est pas 2. »"]],
          [{ question_setup: "a = 1", question_statement: "{% input_text 'r' solution=a %}", question_check: "ok_answer['r'] = True\nx = 1 / 0" },
            ["Graine 0 : « question_check » lève une erreur quand on saisit la solution, ligne 2", "ZeroDivisionError"]],
          [{ question_setup: "M = [[1, 2], [3, 4]]", question_statement: "{% input_matrix 'm' size=2 solution=M %}",
             question_check: "ok_answer['m[0][0]'] = ok_answer['m[1][1]'] = True" },
            ["la solution du champ « m » (cases [0][1], [1][0]) est jugée fausse par « question_check »"]],
          [{ question_setup: "c = ['a', 'b', 'c']\ns = [2, 0]", question_statement: "{% input_checkbox 'r' choices=c solution=s %}",
             question_check: "ok_answer['r'] = r == s" },
            ["la solution du champ « r » est jugée fausse par « question_check »"]],
          // Hasard que la graine ne fixe pas : un compteur gardé hors de l’espace de noms change à
          // chaque exécution, à coup sûr (l’heure le ferait presque toujours, mais pas toujours).
          [{ question_setup: "import sys\nsys.compteur_essai = getattr(sys, 'compteur_essai', 0) + 1\na = sys.compteur_essai",
             question_statement: "{{ a }} {% input_text 'r' solution=a %}" },
            ["Graine 0 : deux exécutions de « question_setup » avec la même graine donnent des tirages différents (les valeurs de l’énoncé, les solutions)"]]
        ];
        for (const [fields, fragments] of cases) {
          let message = "";
          try {
            await PyWimsCompiler.computeDraws({ question_check: "ok_answer['r'] = True", ...fields }, { count: 1 });
          } catch (error) {
            message = error.message;
          }
          const missing = fragments.filter(fragment => !message.includes(fragment));
          if (missing.length) {
            throw new Error(`Pour ${JSON.stringify(fields.question_setup)}, message « ${message} » sans : ${missing.join(" / ")}`);
          }
        }
        // Les mêmes formules en chaînes brutes, et un retour à la ligne, sont acceptés.
        await PyWimsCompiler.computeDraws({
          question_setup: "a = 1\nt = r'$\\frac{1}{2}$'",
          question_statement: "{% input_text 'r' solution=a %}",
          question_check: "ok_answer['r'] = True\nfeedback = rf'{a} $\\times$ 2' + '\\n'"
        }, { count: 1 });
      });

      // Questions réellement compilées puis ouvertes : Python reproduit le tirage et juge la solution juste.
      const resourceTexts = {};
      for (const [key, path] of Object.entries(PyWimsCompiler.resourcePaths)) {
        resourceTexts[key] = await (await fetch(`../${path}`)).text();
      }

      // Ouvre une feuille compilée dans un cadre. Un seul tirage par question : le tirage affiché est connu.
      async function openCompiledSheet(questions, title = null) {
        const resources = Object.fromEntries(
          PyWimsCompiler.neededResources(questions.map(question => question.fields)).map(key => [key, resourceTexts[key]])
        );
        const frame = document.createElement("iframe");
        frame.style.cssText = "width:900px;height:700px";
        frame.srcdoc = title === null
          ? PyWimsCompiler.assembleQuestion(questions[0].fields, questions[0].draws, resources)
          : PyWimsCompiler.assembleActivity(title, questions, resources);
        document.body.append(frame);
        await new Promise(resolve => frame.addEventListener("load", resolve, { once: true }));
        return frame;
      }

      // Saisit la solution du tirage affiché de la question n, comme le ferait un élève, puis la vérifie.
      async function solveQuestion(frame, n, fields, shown) {
        const page = frame.contentDocument;
        const frameWindow = frame.contentWindow;
        const section = page.getElementById(`q${n}`);
        const role = name => section.querySelector(`[data-role="${name}"]`);
        const waitFor = async (predicate, description, timeout) => {
          const end = Date.now() + timeout;
          while (Date.now() < end) {
            if (role("status").classList.contains("is-error")) {
              throw new Error(`question ${n} : ${role("status").textContent}`);
            }
            if (predicate()) return;
            await new Promise(resolve => setTimeout(resolve, 100));
          }
          throw new Error(`Délai dépassé (question ${n}) : ${description}`);
        };
        const inputs = () => [...section.querySelectorAll("[data-name], [data-matrix-name]")];
        await waitFor(() => inputs().length, "affichage de l’énoncé", 5000);
        if (PyWimsTemplate.tagTypes(fields.question_statement).has("input_math")) {
          await frameWindow.customElements.whenDefined("math-field");
        }
        for (const viewport of section.querySelectorAll(".pw-vmatrix-viewport")) {
          const cells = shown.solutions[viewport.dataset.vmatrixName];
          frameWindow.PyWimsWidgets.resizeVariableMatrix(viewport, cells.length, cells[0].length);
        }
        // Champ à choix : l’élève coche les bons choix.
        for (const group of section.querySelectorAll(".pw-choices")) {
          const solution = shown.solutions[group.dataset.name];
          const good = new Set(Array.isArray(solution) ? solution : [solution]);
          for (const box of group.querySelectorAll("input")) box.checked = good.has(Number(box.value));
        }
        for (const input of inputs().filter(input => !input.matches(".pw-choices"))) {
          if (!input.id.startsWith(`q${n}-form_txt_`)) {
            throw new Error(`Identifiant non préfixé : ${input.id}`);
          }
          const { name, matrixName, matrixRow, matrixColumn } = input.dataset;
          const solution = matrixName === undefined
            ? shown.solutions[name]
            : shown.solutions[matrixName][Number(matrixRow)]?.[Number(matrixColumn)];
          if (solution !== undefined) input.value = solution ?? "1";
        }
        role("prompt").dispatchEvent(new Event("input"));
        role("check").click();
        await waitFor(() => role("feedback").classList.contains("is-visible"), "retour de la correction", 120000);
        if (!role("feedback").classList.contains("is-correct")) {
          throw new Error(`question ${n}, solution jugée fausse : ${role("feedback").textContent}`);
        }
      }

      const compiledQuestions = [];
      for (const [file, fields] of Object.entries(questionFields)) {
        await test(`la question compilée ${file} affiche un tirage et accepte sa solution`, async () => {
          const draws = (await PyWimsCompiler.computeDraws(fields, { count: 4 })).slice(-1);
          compiledQuestions.push({ fields, draws });
          const frame = await openCompiledSheet([{ fields, draws }]);
          try {
            await solveQuestion(frame, 1, fields, draws[0]);
          } finally {
            frame.remove();
          }
        });
      }

      await test("un QCM compilé affiche ses choix mélangés, rejoue le tirage et accepte sa solution", async () => {
        const fields = {
          question_title: "Nombres premiers",
          question_layout: "STD",
          question_setup: "from random import sample\nfrom sympy import isprime\nnombres = sample(range(2, 30), 4)\n" +
            "choix = [f'${k}$' for k in nombres]\nbonnes = [i for i, k in enumerate(nombres) if isprime(k)]",
          question_statement: "Lesquels sont premiers ? {% input_checkbox 'reponse' choices=choix solution=bonnes columns=2 %}",
          question_check: "ok_answer['reponse'] = reponse == bonnes\nfeedback = 'Bravo !' if ok_answer['reponse'] else 'Non.'"
        };
        const draws = (await PyWimsCompiler.computeDraws(fields, { count: 4 })).slice(-1);
        compiledQuestions.push({ fields, draws });
        const frame = await openCompiledSheet([{ fields, draws }]);
        try {
          const shown = [...frame.contentDocument.querySelectorAll(".pw-choice")].map(label => Number(label.dataset.choiceIndex));
          if (shown.join() !== draws[0].orders.reponse.join()) {
            throw new Error(`Ordre affiché ${shown}, attendu ${draws[0].orders.reponse}`);
          }
          await solveQuestion(frame, 1, fields, draws[0]);
        } finally {
          frame.remove();
        }
      });

      await test("un QCM compilé sans « question_check » se corrige sans que la page charge Pyodide", async () => {
        const fields = {
          question_title: "Nombres premiers, sans question_check",
          question_layout: "STD",
          question_setup: "from random import sample\nfrom sympy import isprime\nnombres = sample(range(2, 30), 4)\n" +
            "choix = [f'${k}$' for k in nombres]\nbonnes = [i for i, k in enumerate(nombres) if isprime(k)]",
          question_statement: "Lesquels sont premiers ? {% input_checkbox 'reponse' choices=choix solution=bonnes columns=2 %}"
        };
        const draws = (await PyWimsCompiler.computeDraws(fields, { count: 4 })).slice(-1);
        // L’activité suivante devient mixte : des questions avec et sans « question_check ».
        compiledQuestions.push({ fields, draws });
        const frame = await openCompiledSheet([{ fields, draws }]);
        try {
          await solveQuestion(frame, 1, fields, draws[0]);
          if (frame.contentWindow.PyWimsPython.isLoaded()) {
            throw new Error("La page a chargé Pyodide pour une question sans « question_check ».");
          }
        } finally {
          frame.remove();
        }
      });

      await test("une activité réunit toutes les questions dans un seul document et les corrige chacune", async () => {
        const frame = await openCompiledSheet(compiledQuestions, "Toutes les questions");
        try {
          if (frame.contentDocument.querySelectorAll(".pw-question").length !== compiledQuestions.length ||
              frame.contentDocument.querySelector("iframe")) {
            throw new Error("L’activité ne contient pas une section par question, sans cadre.");
          }
          for (const [index, { fields, draws }] of compiledQuestions.entries()) {
            await solveQuestion(frame, index + 1, fields, draws[0]);
          }
        } finally {
          frame.remove();
        }
      });

      // Calcul sans fin (SPECIFICATION.md, §§ 3 et 5.1) : en dernier, car il relance le moteur Python.
      await test("un calcul sans fin est arrêté au bout du délai, et le moteur Python repart", async () => {
        const looping = PyWimsPython.createSession("boucle");
        await looping.initialize("x = 1");
        const epochBefore = PyWimsPython.epoch();
        const start = performance.now();
        let error = null;
        await looping.run("while True:\n    pass", { timeoutMs: 1500 }).catch(caught => { error = caught; });
        const elapsed = performance.now() - start;
        if (error?.name !== "PyWimsTimeout" || elapsed > 10000 || PyWimsPython.epoch() !== epochBefore + 1) {
          throw new Error(`Arrêt inattendu : ${error?.name} ${error?.message}, après ${Math.round(elapsed)} ms`);
        }
        // Le moteur relancé accepte de nouvelles sessions ; l’ancienne n’existe plus.
        const fresh = PyWimsPython.createSession("check-loop");
        await fresh.initialize("x = 1");
        if (await fresh.run("1 + 1") !== 2) throw new Error("Le moteur relancé ne calcule pas.");
        let lost = false;
        await looping.run("x").catch(() => { lost = true; });
        if (!lost) throw new Error("La session d’avant la relance existe encore.");
      });

      await test("une boucle sans fin dans « question_setup » arrête la compilation avec un message clair", async () => {
        let message = "";
        try {
          await PyWimsCompiler.computeDraws({
            question_setup: "a = 1\nwhile True:\n    pass",
            question_statement: "{% input_text 'r' solution=a %}"
          }, { count: 1, timeoutMs: 1500 });
        } catch (error) {
          message = error.message;
        }
        if (!message.includes("« question_setup » n’a pas terminé en 1.5 s pour la graine 0 (boucle sans fin ?)")) {
          throw new Error(`Message inattendu : ${message}`);
        }
      });

      document.getElementById("progress").textContent = "Tests terminés.";
      document.body.dataset.done = "true";
    })();
  </script>
</body>
</html>
