<!doctype html>
<!-- Interface locale qui permet de choisir, filtrer, prévisualiser et compiler les exercices. -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compilateur PyWimsOnHTML</title>
  <style>
    /* Palette neutre de l’interface du compilateur, distincte de la charte des exercices. */
    :root {
      color-scheme: light;
      font-family: system-ui, sans-serif;
      color: #242424;
      background: #f5f6f8;
    }

    * { box-sizing: border-box; }

    /* La page tient dans la fenêtre ; seuls les panneaux de contenu défilent. */
    body {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 0.75rem;
      width: min(100%, 90rem);
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      padding: 0.75rem clamp(0.75rem, 2vw, 1.5rem);
      overflow: hidden;
    }

    /* Les notifications restent dans la barre de titre sans déplacer les panneaux. */
    .titlebar {
      display: flex;
      min-width: 0;
      min-height: 3.5rem;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    h1 { margin: 0; color: #a95f00; font-size: clamp(1.4rem, 3vw, 2rem); }
    h2, h3 { margin-top: 0; }
    button, input { font: inherit; }

    .message-stack {
      display: grid;
      flex: 0 1 34rem;
      min-width: 0;
      height: 2.8rem;
      grid-template-rows: 1fr 1fr;
      align-items: center;
      text-align: right;
    }

    .header-message {
      min-width: 0;
      overflow: hidden;
      margin: 0;
      font-size: 0.86rem;
      line-height: 1.25;
      text-overflow: ellipsis;
      overflow-wrap: anywhere;
    }

    /* Contrôle du dossier et affichage de son nom sélectionné. */
    .folder-row {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 0.8rem;
      padding: 0.75rem;
      border: 1px solid #d7dbe0;
      border-radius: 0.5rem;
      background: #fff;
    }

    .folder-button,
    #compile-exercise {
      padding: 0.55rem 0.9rem;
      border: 1px solid #9b5700;
      border-radius: 0.35rem;
      color: #fff;
      background: #a95f00;
      font-weight: 600;
      cursor: pointer;
    }

    .folder-button:hover,
    #compile-exercise:hover:not(:disabled) { background: #874c00; }
    #compile-exercise:disabled { cursor: not-allowed; opacity: 0.55; }
    #project-folder { display: none; }

    #folder-name {
      min-width: 0;
      overflow: hidden;
      color: #555;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Répartition de la liste des exercices et du panneau de prévisualisation. */
    .workspace {
      display: grid;
      grid-template-columns: minmax(17rem, 0.8fr) minmax(0, 1.7fr);
      gap: 1rem;
      min-width: 0;
      min-height: 0;
    }

    /* Colonne de gauche : le dossier au-dessus de la liste, qui prend la hauteur restante. L’aperçu,
       à droite, garde ainsi toute la hauteur de la fenêtre. */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      min-width: 0;
      min-height: 0;
    }

    .sidebar .panel-exercises { flex: 1 1 auto; }

    .panel {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      padding: 1rem;
      overflow: auto;
      border: 1px solid #d7dbe0;
      border-radius: 0.5rem;
      background: #fff;
      box-shadow: 0 1px 3px #0000000a;
    }

    .panel-exercises { overflow: auto; }
    /* L’aperçu défile dans son propre cadre : le panneau, lui, reste fixe. */
    .panel-preview { overflow: hidden; }

    .panel h2 { margin-bottom: 0.75rem; font-size: 1.15rem; }
    .filter-row { margin-bottom: 0.65rem; }

    #exercise-search {
      width: 100%;
      padding: 0.55rem 0.65rem;
      border: 1px solid #aeb5bd;
      border-radius: 0.3rem;
    }

    /* Les lignes filtrées restent accessibles dans une liste indépendante. */
    #exercise-list {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .filter-row { position: sticky; top: -1rem; z-index: 1; padding-top: 0.25rem; background: #fff; }

    #exercise-list li + li { margin-top: 0.25rem; }

    #exercise-list li {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 0.25rem;
    }

    .exercise-selection { padding: 0 0.2rem; }
    #selection-count { margin: 0.25rem 0 0.5rem; font-size: 0.85rem; }

    #exercise-list button {
      width: 100%;
      padding: 0.6rem 0.65rem;
      border: 0;
      border-radius: 0.3rem;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }

    #exercise-list button:hover { background: #f1f3f5; }
    #exercise-list button[aria-current="true"] {
      color: #633900;
      background: #fff0d8;
      font-weight: 600;
    }

    .exercise-title {
      display: block;
      overflow-wrap: anywhere;
    }

    .exercise-fields {
      display: block;
      margin-top: 0.15rem;
      color: #656b72;
      font-size: 0.8rem;
      font-weight: 400;
    }

    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    #preview-heading { margin: 0; }
    #preview-heading .muted { font-size: 0.85rem; font-weight: 400; }

    #multi-output-controls {
      display: grid;
      gap: 0.5rem;
      min-width: min(14rem, 45%);
      align-content: start;
      font-size: 0.9rem;
    }

    #multi-output-controls select,
    #activity-title { width: 100%; min-width: 0; padding: 0.4rem; }

    #preview-notice { margin: 0.6rem 0 0; font-size: 0.85rem; }
    #preview-notice:empty { display: none; }

    /* Cadre de l’aperçu : il occupe la hauteur restante du panneau et défile lui-même. */
    #preview-frame {
      display: block;
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      margin-top: 0.75rem;
      border: 1px solid #e0e3e7;
      border-radius: 0.35rem;
      background: #fff;
    }

    .muted { color: #656b72; }
    .error { color: #8a1111; }
    .success { color: #176326; }
    .transient-message { opacity: 1; transition: opacity 700ms ease; }
    .transient-message.is-fading { opacity: 0; }

    [hidden] { display: none !important; }

    /* Sur petit écran, les deux panneaux sont empilés et gardent leur défilement. */
    @media (max-width: 720px) {
      body { gap: 0.5rem; padding: 0.5rem; }
      .titlebar { min-height: 3rem; gap: 0.5rem; }
      .message-stack { flex-basis: 45%; height: 2.5rem; }
      .header-message { font-size: 0.72rem; }
      .folder-row { gap: 0.5rem; padding: 0.5rem; }
      .sidebar { gap: 0.5rem; }
      .folder-button { flex: 0 0 auto; padding: 0.45rem 0.6rem; font-size: 0.85rem; }
      .workspace {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: minmax(7rem, 0.75fr) minmax(0, 1.25fr);
        gap: 0.5rem;
      }
      .panel { padding: 0.65rem; }
      .panel h2 { margin-bottom: 0.45rem; }
      .panel-heading { gap: 0.5rem; }
      #compile-exercise { flex: 0 0 auto; }
      #multi-output-controls { min-width: 100%; }
      .panel-heading { flex-wrap: wrap; }
    }

    @media (prefers-reduced-motion: reduce) {
      .transient-message { transition: none; }
    }
  </style>
</head>
<body>
  <!-- Barre de titre et deux emplacements de notification transitoires. -->
  <header class="titlebar">
    <h1>Compilateur PyWimsOnHTML</h1>
    <div class="message-stack" aria-live="polite">
      <p id="project-status" class="header-message muted transient-message" role="status" hidden></p>
      <p id="messages" class="header-message transient-message" role="status" hidden></p>
    </div>
  </header>
  <!-- La zone principale : à gauche le dossier et la liste filtrable, à droite l’aperçu sur toute la hauteur. -->
  <main class="workspace">
    <div class="sidebar">
      <!-- Le sélecteur donne au compilateur accès local au dossier choisi par l’utilisateur. -->
      <div class="folder-row">
        <!-- Le bouton devient « Dossier ouvert : » une fois un dossier choisi ; il permet d’en ouvrir un autre. -->
        <button class="folder-button" id="choose-folder" type="button">Ouvrir un dossier</button>
        <input id="project-folder" type="file" webkitdirectory directory multiple>
        <span id="folder-name" aria-live="polite">Aucun dossier ouvert</span>
      </div>
      <!-- Filtres et liste des fichiers d’exercice chargés depuis le dossier. -->
      <section class="panel panel-exercises" aria-labelledby="exercise-list-heading">
        <h2 id="exercise-list-heading">Questions / exercices</h2>
        <div class="filter-row">
          <label for="exercise-search">Filtrer par nom ou mot-clé</label>
          <input id="exercise-search" type="search" placeholder="ex. arithmétique, PGCD" autocomplete="off">
        </div>
        <p id="selection-count" class="muted" aria-live="polite">Aucune question sélectionnée.</p>
        <ul id="exercise-list" aria-label="Fichiers d’exercice"></ul>
        <p id="list-empty" class="muted">Ouvrez un dossier pour afficher ses fichiers d’exercice.</p>
      </section>
    </div>

    <!-- Aperçu de l’exercice et bouton de génération du fichier autonome. -->
    <section class="panel panel-preview" aria-labelledby="preview-heading">
      <div class="panel-heading">
        <h2 id="preview-heading">Aperçu de l’exercice <span class="muted">(compiler pour le tester)</span></h2>
        <div id="multi-output-controls" hidden>
          <label for="output-mode">Compilation de la sélection</label>
          <select id="output-mode">
            <option value="separate">Pages séparées (ZIP)</option>
            <option value="activity">Activité unique</option>
          </select>
          <label id="activity-title-label" for="activity-title" hidden>Titre de l’activité</label>
          <input id="activity-title" type="text" autocomplete="off" placeholder="Titre de l’activité" hidden>
        </div>
        <button id="compile-exercise" type="button" disabled>Compiler</button>
      </div>
      <!-- Ligne d’état : attente du tirage réel ou erreur ; vide une fois l’aperçu prêt. -->
      <p id="preview-notice" class="muted">Choisissez un exercice dans la liste pour afficher son aperçu.</p>
      <!-- La page réelle de l’exercice, isolée : sans « allow-same-origin », son HTML ne peut pas
           agir sur le compilateur. compiler.js y remplace Python par une version inerte. Le cadre
           occupe la hauteur restante du panneau et défile lui-même. -->
      <iframe id="preview-frame" title="Aperçu de l’exercice" sandbox="allow-scripts" hidden></iframe>
    </section>
  </main>
  <!-- Le contrôleur relie les interactions de cette page au compilateur. -->
  <script src="../runtime/template.js"></script>
  <!-- Correction par défaut : le contrôle de cohérence d’une question sans « apres » l’utilise. -->
  <script src="../runtime/correction.js"></script>
  <!-- Le compilateur exécute « avant » pour calculer les tirages ; Pyodide se charge au premier besoin. -->
  <script src="../runtime/python.js"></script>
  <script src="compiler.js"></script>
</body>
</html>
