<!doctype html>
<!-- Banc de tests navigateur autonome du parseur, des widgets et de la génération HTML. -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Tests du compilateur PyWimsOnHTML</title>
</head>
<body>
  <h1>Tests du compilateur</h1>
  <!-- Chaque vérification ajoute ici son résultat sans bloquer les tests suivants. -->
  <ol id="results"></ol>
  <script src="../runtime/template.js"></script>
  <script src="../runtime/correction.js"></script>
  <script src="../compiler/format.js"></script>
  <script src="../compiler/draws.js"></script>
  <script src="../compiler/assemble.js"></script>
  <script src="../compiler/zip.js"></script>
  <script src="../compiler/compiler.js"></script>
  <script src="../widgets/input-matrix.js"></script>
  <script src="../widgets/input-math.js"></script>
  <script src="../widgets/input-text.js"></script>
  <script src="../widgets/input-choice.js"></script>
  <script>
    const results = document.getElementById("results");
    // Exécute un contrôle isolément afin qu’un échec ne masque pas les autres résultats.
    function test(name, callback) {
      const item = document.createElement("li");
      try {
        callback();
        item.textContent = `RÉUSSI : ${name}`;
      } catch (error) {
        item.textContent = `ÉCHEC : ${name} — ${error.message}`;
        item.style.color = "red";
      }
      results.append(item);
    }
    // Petite question source partagée par les tests du format et des champs facultatifs.
    const source = `%\n% question_title\n%\nEssai\n%\n% question_keywords\n%\nmathématiques, PGCD\n%\n% question_layout\n%\nSTD\n%\n% question_setup\n%\nx = 3\n%\n% question_statement\n%\nBonjour {{x}} {% input_text 'reponse' solution=x style='width:5em' %}\n%\n% question_check\n%\nok_answer['reponse'] = reponse == '3'\nfeedback = 'Fini'\n%`;
    test("analyse le format des champs", () => {
      const fields = PyWimsCompiler.parseQuestionSource(source);
      if (fields.question_title !== "Essai" || fields.question_keywords !== "mathématiques, PGCD") throw new Error("Les valeurs des champs sont différentes.");
    });
    // Grammaire unique des balises (runtime/template.js).
    const expectTagError = (source, fragment) => {
      try {
        PyWimsTemplate.parseTag(source);
      } catch (error) {
        if (!error.message.includes(fragment)) {
          throw new Error(`Message inattendu pour « ${source} » : ${error.message}`);
        }
        return;
      }
      throw new Error(`Balise invalide acceptée : ${source}`);
    };
    test("chaque balise de saisie exige un attribut solution et un nom non réservé", () => {
      for (const source of [
        "input_text 'resultat' solution=somme style='width:7em'",
        "input_math 'derivee' solution=derivee",
        "input_matrix 'matrice' rows=m cols=p solution=produit",
        "input_vmatrix 'matrice' max_rows=5 solution=produit"
      ]) {
        const tag = PyWimsTemplate.parseTag(source);
        if (!tag.attributes.solution || !/^(somme|derivee|produit)$/.test(tag.attributes.solution)) {
          throw new Error(`Solution non reconnue dans : ${source}`);
        }
      }
      expectTagError("input_text 'x' solution='12'", "doit être un nom de variable");
      expectTagError("input_math 'derivee'", "Le champ « derivee » doit indiquer sa solution");
      expectTagError("input_text 'feedback' solution=s", "Le nom de champ « feedback » est réservé");
      expectTagError("input_text 'lambda' solution=s", "Le nom de champ « lambda » est réservé");
    });
    test("les balises invalides produisent un message précis", () => {
      expectTagError("input_select 'choix'", "Balise de modèle non prise en charge");
      expectTagError("input_text 'x' couleur='rouge'", "Attribut « couleur » inconnu pour input_text");
      expectTagError("input_vmatrix 'm' max_rows=n", "doit être un entier");
      expectTagError("input_text 'x' style='a' style='b'", "Attribut « style » répété");
      expectTagError("input_text 'x' style=", "Syntaxe d’attribut invalide");
      const errors = PyWimsTemplate.validateTemplate(
        "{% input_text 'ok' solution=s %} {% input_select 'a' %} {% input_math 'b' taille=2 %}"
      );
      if (errors.length !== 2) {
        throw new Error(`Toutes les balises invalides doivent être signalées : ${errors.join(" ; ")}`);
      }
    });
    test("les champs à choix exigent leurs choix et vérifient colonnes et barème", () => {
      const radio = PyWimsTemplate.parseTag("input_radio 'r' choices=choix solution=bonne columns=2 fixed_last=1 scoring='b=2, m=-0.5'");
      if (radio.attributes.choices !== "choix" || radio.attributes.columns !== 2 || radio.attributes.fixed_last !== 1 ||
          !PyWimsTemplate.choiceTypes.has("input_checkbox")) {
        throw new Error(`Attributs mal lus : ${JSON.stringify(radio.attributes)}`);
      }
      expectTagError("input_checkbox 'r' solution=bonnes", "doit indiquer ses choix");
      expectTagError("input_radio 'r' choices=c solution=s columns=7", "« columns » doit être compris entre 1 et 6");
      expectTagError("input_radio 'r' choices=c solution=s scoring='b=1,formula=NBC'", "« formula » d’AMC n’est pas prise en charge");
      expectTagError("input_radio 'r' choices=c solution=s scoring='set.X=1'", "« set.X » d’AMC n’est pas prise en charge");
      expectTagError("input_radio 'r' choices=c solution=s scoring='z=1'", "Directive de barème inconnue « z »");
      expectTagError("input_radio 'r' choices=c solution=s scoring='b=un'", "« b » doit être un nombre");
      expectTagError("input_radio 'r' choices=c solution=s scoring='-2'", "barème propre à une réponse");
      expectTagError("input_radio 'r' choices=c solution=s scoring='b=1,b=2'", "« b » répétée");
    });
    test("le barème suit la syntaxe d’AMC et n’est admis que pour un champ seul", () => {
      const scoring = PyWimsTemplate.parseScoring("b=2,m=-0.5, v=0,e=-1,mz=3,haut=4,MAX=5,p=0,P=6,d=.5");
      if (JSON.stringify(scoring) !== JSON.stringify({ b: 2, m: -0.5, v: 0, e: -1, mz: 3, haut: 4, MAX: 5, p: 0, P: 6, d: 0.5 })) {
        throw new Error(`Barème mal lu : ${JSON.stringify(scoring)}`);
      }
      const alone = PyWimsTemplate.validateTemplate("{% input_checkbox 'r' choices=c solution=s scoring='mz=1' %}");
      const shared = PyWimsTemplate.validateTemplate(
        "{% input_checkbox 'r' choices=c solution=s scoring='mz=1' %} {% input_text 't' solution=a %}"
      );
      if (alone.length || shared.length !== 1 || !shared[0].includes("seul champ de la question")) {
        throw new Error(`Règle du champ seul mal appliquée : ${JSON.stringify([alone, shared])}`);
      }
    });
    test("la note suit le barème d’AMC, y compris les exemples de sa documentation", () => {
      const note = (scoring, multiple, checked, solution, count = 4) =>
        PyWimsTemplate.scoreChoice(PyWimsTemplate.parseScoring(scoring), { multiple, count, checked, solution });
      const cases = [
        // Documentation d’AMC : Ami et Autre sont justes ; la copie coche Ami et Otarie.
        [note("b=2,m=-0.5", true, [0, 3], [0, 2]), { score: 3, max: 8 }],
        // Choix unique de la documentation : bonne réponse 2, mauvaise -0,5.
        [note("b=2,m=-0.5", false, [0], [0], 3), { score: 2, max: 2 }],
        [note("b=2,m=-0.5", false, [1], [0], 3), { score: -0.5, max: 2 }],
        [note("mz=3", true, [0, 2], [0, 2]), { score: 3, max: 3 }],
        [note("mz=3", true, [0], [0, 2]), { score: 0, max: 3 }],
        // haut=4 : 4 pour une réponse parfaite, un point de moins par case mal traitée, plancher 0.
        [note("haut=4", true, [0], [0, 2]), { score: 3, max: 4 }],
        [note("haut=2", true, [1, 3], [0, 2]), { score: 0, max: 2 }],
        // v : rien n’est coché alors que la solution n’est pas vide ; sinon ne rien cocher peut être parfait.
        [note("b=1,v=-1", true, [], [0, 2]), { score: -1, max: 4 }],
        [note("b=1,m=-1", true, [], []), { score: 4, max: 4 }],
        [note("b=1,m=-1,p=0", true, [1, 3], [0, 2]), { score: 0, max: 4 }],
        [note("b=1,P=3", true, [0, 2], [0, 2]), { score: 3, max: 3 }],
        [note("b=1,d=1,MAX=5", true, [0, 2], [0, 2]), { score: 5, max: 5 }]
      ];
      for (const [[actual, expected], index] of cases.map((pair, index) => [pair, index])) {
        if (JSON.stringify(actual) !== JSON.stringify(expected)) {
          throw new Error(`Cas ${index + 1} : ${JSON.stringify(actual)} au lieu de ${JSON.stringify(expected)}`);
        }
      }
    });
    test("l’ordre des choix est un mélange reproductible qui garde les derniers choix fixés", () => {
      const first = PyWimsCompiler.choiceOrder(6, 2, 7, "reponse");
      const permutation = [...first].sort((a, b) => a - b).join();
      const orders = new Set(Array.from({ length: 20 }, (_, seed) => PyWimsCompiler.choiceOrder(6, 2, seed, "reponse").join()));
      if (JSON.stringify(first) !== JSON.stringify(PyWimsCompiler.choiceOrder(6, 2, 7, "reponse")) ||
          permutation !== "0,1,2,3,4,5" || first.slice(-2).join() !== "4,5" ||
          orders.size < 10 ||
          PyWimsCompiler.choiceOrder(6, 0, 7, "reponse").join() === PyWimsCompiler.choiceOrder(6, 0, 7, "autre").join()) {
        throw new Error(`Ordre inattendu : ${first} (${orders.size} ordres distincts sur 20 graines)`);
      }
    });
    test("l’aperçu provisoire d’un champ à choix nomme ses choix d’après leur liste", () => {
      const draw = PyWimsCompiler.previewPlaceholderDraw({ question_statement: "{% input_radio 'r' choices=choix solution=s %}" });
      if (draw.choices.r.join() !== "choix[0],choix[1]" || draw.orders.r.join() !== "0,1") {
        throw new Error(`Tirage provisoire inattendu : ${JSON.stringify(draw)}`);
      }
    });
    test("un champ à choix affiche ses choix dans l’ordre du tirage, échappés et à l’abri du modèle", () => {
      const html = PyWimsTemplate.renderTemplate(
        "{{ a }} {% input_checkbox 'r' choices=c solution=s %}",
        { a: "A" },
        tag => PyWimsWidgets.inputChoice(tag.name, {
          multiple: true, texts: ["<b>", "{{ a }}", "$x^{2}$"], order: [2, 0, 1], columns: 2, idPrefix: "q3-"
        })
      );
      const host = document.createElement("div");
      host.innerHTML = html;
      const inputs = [...host.querySelectorAll(".pw-choice input")];
      const texts = [...host.querySelectorAll(".pw-choice-text")].map(text => text.textContent);
      if (inputs.map(input => input.value).join() !== "2,0,1" ||
          inputs.some(input => input.type !== "checkbox" || input.name !== "q3-r") ||
          inputs[0].id !== "q3-form_choice_r_2" ||
          JSON.stringify(texts) !== JSON.stringify(["$x^{2}$", "<b>", "{{ a }}"]) ||
          host.querySelector("b") || host.querySelector(".pw-choices").dataset.name !== "r" ||
          !host.querySelector(".pw-choices").getAttribute("style").includes("--pw-choice-columns:2")) {
        throw new Error(`Rendu inattendu : ${html}`);
      }
      const radio = PyWimsWidgets.inputChoice("q", { texts: ["a", "b"], order: [1, 0] });
      if (!radio.includes('type="radio"') || !radio.includes('data-multiple="false"')) {
        throw new Error("Un choix unique doit utiliser des boutons radio.");
      }
      for (const options of [{ texts: ["a"], order: [0] }, { texts: ["a", "b"], order: [0, 0] }, { texts: ["a", "b"], order: [0, 1], columns: 7 }]) {
        let rejected = false;
        try {
          PyWimsWidgets.inputChoice("q", options);
        } catch {
          rejected = true;
        }
        if (!rejected) throw new Error(`Choix invalides acceptés : ${JSON.stringify(options)}`);
      }
    });
    // Une valeur admet les balises de mise en forme (SPECIFICATION.md, § 2.1) ; le reste est échappé.
    test("le rendu du modèle remplace balises et variables en échappant les valeurs", () => {
      const html = PyWimsTemplate.renderTemplate(
        "Calcul {{ x }} : {% input_text 'r' solution=s style='width:3em' %}",
        { x: "<b>&</b> <script>x < 3</scr" + "ipt>" },
        tag => `[${tag.type}:${tag.name}:${tag.attributes.style}]`
      );
      if (html !== "Calcul <b>&amp;</b> &lt;script&gt;x &lt; 3&lt;/scr" + "ipt&gt; : [input_text:r:width:3em]" ||
          PyWimsTemplate.escapeHtml(`"'`) !== "&quot;&#39;") {
        throw new Error(`Rendu inattendu : ${html}`);
      }
      let rejected = false;
      try {
        PyWimsTemplate.renderTemplate("{{ inconnue }}", {}, () => "");
      } catch (error) {
        rejected = error.message.includes("Variable de question inconnue : inconnue");
      }
      if (!rejected) throw new Error("Une variable absente du contexte a été acceptée.");
    });
    test("les widgets partagés restent disponibles quel que soit leur ordre de chargement", () => {
      if (typeof PyWimsWidgets.inputText !== "function" ||
          typeof PyWimsWidgets.inputMath !== "function" ||
          typeof PyWimsWidgets.inputMatrix !== "function" ||
          typeof PyWimsWidgets.enableVariableMatrixResize !== "function") {
        throw new Error("Le chargement d’un widget a remplacé les fonctions déjà enregistrées.");
      }
    });
    // Ressources minimales pour assembler une feuille : la mise en page réelle, des scripts vides.
    const sheetResources = layout => ({
      layout, brandCss: "", questionCss: "", template: "", correction: "", textWidget: "", mathWidget: "",
      matrixWidget: "", choiceWidget: "", python: "", pywims: "", pythonWorker: "", fields: "", question: "", sheet: ""
    });
    const sheetQuestion = (title, question_statement) => ({
      fields: { question_title: title, question_keywords: "", question_layout: "STD", question_setup: "a = 1", question_statement, question_check: "ok_answer['r'] = True" },
      draws: [{ seed: 0, context: {}, dimensions: {}, solutions: { r: "1" } }]
    });
    function testSheetAssembly(layout) {
      test("une activité est un seul document avec une section par question", () => {
        const html = PyWimsCompiler.assembleActivity("Activité & révision", [
          sheetQuestion("Question <1>", "Un {% input_text 'r' solution=a %}"),
          sheetQuestion("Question 2", "Deux {% input_text 'r' solution=a %}")
        ], sheetResources(layout));
        const page = new DOMParser().parseFromString(html, "text/html");
        const sections = [...page.querySelectorAll("main .pw-question")];
        const field = (section, name) => section.querySelector(`.pw-question-data[hidden] pre[data-field="${name}"]`)?.textContent;
        if (page.title !== "Activité & révision" || page.body.dataset.sheet !== "activity" ||
            page.querySelector("iframe") ||
            sections.map(section => section.id).join() !== "q1,q2" ||
            field(sections[0], "question_title") !== "Question <1>" ||
            field(sections[1], "question_statement") !== "Deux {% input_text 'r' solution=a %}" ||
            JSON.parse(sections[0].querySelector("pre[data-draws]").textContent)[0].solutions.r !== "1" ||
            !page.getElementById("pw-question-template")) {
          throw new Error("L’activité n’assemble pas ses questions dans un seul document.");
        }
        for (const [title, questions] of [["", [sheetQuestion("A", "x"), sheetQuestion("B", "y")]], ["Seule", [sheetQuestion("A", "x")]]]) {
          let rejected = false;
          try {
            PyWimsCompiler.assembleActivity(title, questions, sheetResources(layout));
          } catch {
            rejected = true;
          }
          if (!rejected) throw new Error("Une activité sans titre ou d’une seule question a été acceptée.");
        }
        const single = new DOMParser().parseFromString(
          PyWimsCompiler.assembleQuestion(sheetQuestion("Seule", "x").fields, sheetQuestion("Seule", "x").draws, sheetResources(layout)),
          "text/html");
        if (single.body.dataset.sheet !== "single" || single.querySelectorAll(".pw-question").length !== 1 ||
            single.getElementById("question-title").textContent !== "Seule") {
          throw new Error("Une question seule n’est pas une feuille d’une question.");
        }
      });
      test("seule une question qui a un « question_check » est marquée comme ayant besoin de Python", () => {
        const withoutApres = sheetQuestion("Sans", "Un {% input_text 'r' solution=a %}");
        delete withoutApres.fields.question_check;
        const page = new DOMParser().parseFromString(PyWimsCompiler.assembleActivity("Mixte", [
          sheetQuestion("Avec", "Un {% input_text 'r' solution=a %}"), withoutApres
        ], sheetResources(layout)), "text/html");
        const marks = [...page.querySelectorAll(".pw-question")].map(section => section.dataset.python);
        if (marks.join() !== "true,false" ||
            page.querySelectorAll(".pw-question")[1].querySelector('pre[data-field="question_check"]')) {
          throw new Error(`Marques inattendues : ${marks.join()}`);
        }
        // « question_setup » ne sert qu’à rejouer un tirage dans Python : absent de la question sans « question_check ».
        const [withPython, withoutPython] = page.querySelectorAll(".pw-question");
        if (!withPython.querySelector('pre[data-field="question_setup"]') || withoutPython.querySelector('pre[data-field="question_setup"]') ||
            !withoutPython.querySelector('pre[data-field="question_statement"]')) {
          throw new Error("« question_setup » doit être intégré seulement à la question qui a un « question_check ».");
        }
      });
      test("MathJax n’est intégré qu’à une feuille qui peut afficher une formule", () => {
        const question = ({ question_statement = "Un {% input_text 'r' solution=a %}", question_check = false, explanation, draw = {} }) => {
          const built = sheetQuestion("Q", question_statement);
          if (!question_check) delete built.fields.question_check;
          if (explanation) built.fields.question_solution_explanation = explanation;
          built.draws = [{ ...built.draws[0], ...draw }];
          return built;
        };
        const hasMathJax = built => /mathjax@/.test(PyWimsCompiler.assembleQuestion(built.fields, built.draws, sheetResources(layout)));
        const cases = [
          ["sans formule ni « question_check »", question({}), false],
          ["formule dans l’énoncé", question({ question_statement: "Calculer $x^2$ : {% input_text 'r' solution=a %}" }), true],
          ["formule \\( \\) dans une valeur", question({ draw: { context: { f: "\\(x\\)" } } }), true],
          ["formule dans un choix", question({ draw: { choices: { c: ["$1$", "deux"] } } }), true],
          ["formule dans l’explication", question({ explanation: "Car $2+2=4$." }), true],
          ["« question_check » sans formule", question({ question_check: true }), true]
        ];
        const wrong = cases.filter(([, built, expected]) => hasMathJax(built) !== expected).map(([name]) => name);
        if (wrong.length) throw new Error(`MathJax mal décidé : ${wrong.join(", ")}`);
      });
      test("l’assemblage refuse un script ou un style qui fermerait sa balise", () => {
        // Les chaînes sont coupées : écrites d’un seul tenant, elles fermeraient le script de cette page.
        const close = element => "</" + element;
        for (const [key, code, fragment] of [
          ["sheet", `const fin = '${close("SCRIPT")}>';`, "@@SHEET@@"],
          ["question", `const fin = '${close("script")}>';`, "@@QUESTION@@"],
          ["fields", `const fin = '${close("script")}>';`, "@@FIELDS@@"],
          ["pythonWorker", `const fin = '${close("script")}>';`, "@@PYTHON_WORKER@@"],
          ["python", `x = '${close("script")}'`, "@@PYTHON_RUNTIME@@"],
          ["questionCss", `/* ${close("style")}> */`, "@@CSS@@"]
        ]) {
          let message = "";
          try {
            PyWimsCompiler.assembleQuestion(sheetQuestion("A", "x").fields, sheetQuestion("A", "x").draws,
              { ...sheetResources(layout), [key]: code });
          } catch (error) {
            message = error.message;
          }
          if (!message.includes(fragment)) {
            throw new Error(`« ${code} » (${key}) a été intégré sans erreur.`);
          }
        }
        // Une chaîne coupée, elle, est acceptée.
        PyWimsCompiler.assembleQuestion(sheetQuestion("A", "x").fields, sheetQuestion("A", "x").draws,
          { ...sheetResources(layout), sheet: "const fin = '</' + 'script>';" });
      });
    }
    test("l’archive des pages séparées est un fichier ZIP", () => {
      const archive = PyWimsCompiler.createZip([{ name: "question.html", content: "<html></html>" }]);
      if (archive.type !== "application/zip" || archive.size < 100) {
        throw new Error("L’archive des pages séparées est vide ou mal typée.");
      }
    });
    // Contrôles asynchrones : la page signale leur fin par data-done sur <body> (outil tests/outils).
    const pendingTests = [];
    pendingTests.push(PyWimsCompiler.createZip([
      { name: "question 1.html", content: "hello" },
      { name: "révision/question 2.html", content: "bonjour" }
    ]).arrayBuffer().then(buffer => {
      const bytes = new Uint8Array(buffer);
      const view = new DataView(buffer);
      const endOffset = bytes.length - 22;
      const centralOffset = view.getUint32(endOffset + 16, true);
      const firstNameLength = view.getUint16(26, true);
      const firstContentOffset = 30 + firstNameLength;
      const centralName = new TextDecoder().decode(
        bytes.slice(centralOffset + 46, centralOffset + 46 + view.getUint16(centralOffset + 28, true))
      );
      if (view.getUint32(0, true) !== 0x04034b50 ||
          view.getUint32(14, true) !== 0x3610a686 ||
          new TextDecoder().decode(bytes.slice(firstContentOffset, firstContentOffset + 5)) !== "hello" ||
          view.getUint32(centralOffset, true) !== 0x02014b50 ||
          view.getUint16(endOffset + 10, true) !== 2 ||
          centralName !== "question 1.html" ||
          view.getUint32(endOffset, true) !== 0x06054b50) {
        throw new Error("La structure ZIP, le CRC ou les noms UTF-8 sont incorrects.");
      }
      const item = document.createElement("li");
      item.textContent = "RÉUSSI : l’archive ZIP contient des entrées valides avec CRC et noms UTF-8";
      results.append(item);
    }).catch(error => {
      const item = document.createElement("li");
      item.textContent = `ÉCHEC : validation détaillée de l’archive ZIP — ${error.message}`;
      item.style.color = "red";
      results.append(item);
    }));
    test("rejette les champs en double", () => {
      let rejected = false;
      try {
        PyWimsCompiler.parseQuestionSource(source.replace("%\n% question_keywords", "%\n% question_title"));
      } catch {
        rejected = true;
      }
      if (!rejected) throw new Error("Le titre en double a été accepté.");
    });
    test("rejette un champ obligatoire absent ou vide", () => {
      for (const [variant, name] of [
        [source.replace("Essai", " "), "question_title"],
        [source.replace("x = 3", "  "), "question_setup"]
      ]) {
        let rejected = false;
        try {
          PyWimsCompiler.parseQuestionSource(variant);
        } catch (error) {
          rejected = error.message.includes(`le champ obligatoire « ${name} » est absent ou vide`);
        }
        if (!rejected) throw new Error(`L’absence du champ « ${name} » n’a pas été signalée.`);
      }
    });
    test("le champ facultatif « question_draws » est un entier de 1 à 200", () => {
      const withCount = count => source.replace("%\n% question_check", `%\n% question_draws\n%\n${count}\n%\n% question_check`);
      if (PyWimsCompiler.parseQuestionSource(withCount(" 5 ")).question_draws !== "5" ||
          Object.hasOwn(PyWimsCompiler.parseQuestionSource(source), "question_draws")) {
        throw new Error("Le champ « question_draws » est mal lu.");
      }
      for (const count of ["0", "201", "2.5", "vingt"]) {
        let message = "";
        try {
          PyWimsCompiler.parseQuestionSource(withCount(count));
        } catch (error) {
          message = error.message;
        }
        if (!message.includes("le champ « question_draws » doit être un entier de 1 à 200")) {
          throw new Error(`« ${count} » accepté, ou message inattendu : ${message}`);
        }
      }
    });
    test("« question_check » est facultatif ; vide, il équivaut à son absence", () => {
      const absent = PyWimsCompiler.parseQuestionSource(source.replace(/%\n% question_check\n%\n[^%]*/, ""));
      const empty = PyWimsCompiler.parseQuestionSource(source.replace(/(% question_check\n%\n)[^%]*/, "$1  \n"));
      for (const fields of [absent, empty]) {

              !questionCss.includes(".pw-vmatrix-viewport") ||
              !questionCss.includes("overflow: clip") ||
              !questionCss.includes(".pw-vmatrix-resize")) {
              throw new Error("La balise redimensionnable n’est pas validée, rendue et collectée par le runtime.");
            }
      });
      test("la poignée ne redimensionne que par cases entières et répond aux flèches", () => {
            const styles = document.createElement("style");
            styles.textContent = questionCss;
            document.head.append(styles);
            const host = document.createElement("div");
            host.innerHTML = PyWimsWidgets.inputVMatrix("clavier", 4, 4, {
              cellWidth: "4em",
              cellHeight: "2em"
            });
            document.body.append(host);
            PyWimsWidgets.enableVariableMatrixResize(host);
            const viewport = host.querySelector(".pw-vmatrix-viewport");
            const handle = host.querySelector(".pw-vmatrix-resize");
            const grid = host.querySelector(".pw-vmatrix-grid");
            const cell = host.querySelector(".pw-vmatrix-cell").getBoundingClientRect();
            const gap = Number.parseFloat(getComputedStyle(grid).columnGap);
            handle.dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowRight", bubbles: true }));
            handle.dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowDown", bubbles: true }));
            const bounds = viewport.getBoundingClientRect();
            // La marge intérieure (où reste visible le contour de focus) entoure les cases visibles.
            const padding = Number.parseFloat(getComputedStyle(viewport).paddingLeft);
            const visibleInputs = [...viewport.querySelectorAll("input[data-vmatrix-name]")]
              .filter(input => {
                const inputBounds = input.getBoundingClientRect();
                return inputBounds.left >= bounds.left - 0.5 &&
                  inputBounds.right <= bounds.right + 0.5 &&
                  inputBounds.top >= bounds.top - 0.5 &&
                  inputBounds.bottom <= bounds.bottom + 0.5;
              });
            if (viewport.dataset.visibleColumns !== "3" ||
                viewport.dataset.visibleRows !== "3" ||
                Math.abs(bounds.width - 2 * padding - (3 * cell.width + 2 * gap)) > 0.5 ||
                Math.abs(bounds.height - 2 * padding - (3 * cell.height + 2 * gap)) > 0.5 ||
                Math.abs(padding - gap) > 0.5 ||
                visibleInputs.length !== 9 ||
                getComputedStyle(viewport).overflowX !== "clip" ||
                getComputedStyle(viewport).overflowY !== "clip") {
              throw new Error(`Taille ${viewport.dataset.visibleRows} × ${viewport.dataset.visibleColumns}, ${visibleInputs.length} cases visibles, débordement ${getComputedStyle(viewport).overflowX}/${getComputedStyle(viewport).overflowY}.`);
            }
            host.remove();
            styles.remove();
          });
          testSheetAssembly(layout);
          test("les données de la question sont intégrées comme texte et non comme JSON dans un script", () => {
            if (!layout.includes("@@QUESTIONS@@") ||
                !compilerScript.includes('<div class="pw-question-data" hidden>') ||
                layout.includes('type="application/json"')) {
              throw new Error("La source de la question n’est pas intégrée comme bloc de texte lisible.");
            }
          });
          // Contrat d’une charte (SPECIFICATION.md, § 11.4) : chaque variable --pw-… qu’utilise
          // question.css est définie par la charte neutre comme par l’exemple UPEC. Une variable
          // oubliée laisserait une couleur ou une police vide, sans erreur.
          test("chaque charte définit toutes les variables qu’utilisent les styles des questions", () => {
            const used = new Set([...questionCss.matchAll(/var\((--pw-[a-z-]+)\)/g)].map(match => match[1]));
            // Variables posées par le code (matrice redimensionnable, colonnes de choix), pas par la charte.
            const local = new Set([...questionCss.matchAll(/(--pw-[a-z-]+)\s*:/g)].map(match => match[1]));
            for (const [name, css] of [["css/brand.css", brandCss], ["css/chartes/upec.css", upecCss]]) {
              const missing = [...used].filter(variable => !local.has(variable) &&
                !["--pw-vmatrix-rows", "--pw-vmatrix-columns", "--pw-choice-columns", "--fb-h"].includes(variable) &&
                !new RegExp(`${variable}\\s*:`).test(css));
              if (missing.length) throw new Error(`${name} ne définit pas : ${missing.join(", ")}`);
            }
          });
          test("la charte neutre n’a ni logo ni police téléchargée", () => {
            if (brandCss.includes("@import") || /url\(/.test(brandCss) ||
                !/\.pw-brand-logo\s*\{\s*display:\s*none/.test(brandCss)) {
              throw new Error("La charte neutre dépend d’un service en ligne ou affiche un logo.");
            }
          });
          test("l’exemple de charte UPEC affiche son logo à droite du titre", () => {
            if (!/<header class="pw-header">[\s\S]*?<h1[^>]*>[\s\S]*?<\/h1>[\s\S]*?<span class="pw-brand-logo" aria-hidden="true"><\/span>[\s\S]*?<\/header>/.test(layout) ||
                !upecCss.includes(".pw-brand-logo {") ||
                !upecCss.includes('url("https://www.u-pec.fr/uas/web/LOGO/2017_11_27_Logotype-UPEC_rvb.svg")') ||
                !upecCss.includes(".pw-brand-logo::after {") ||
                !upecCss.includes("background: #fff") ||
                !upecCss.includes("clip-path: polygon(0 62.3%, 0 100%, 100% 37.7%, 100% 0)") ||
                !upecCss.includes("height: 100%") ||
                !upecCss.includes("gap: 0.75rem") ||
                !upecCss.includes("padding: 0 0 0 20px") ||
                !upecCss.includes("overflow: clip") ||
                !/@media \(max-width: 640px\)[\s\S]*?\.pw-header\s*\{\s*height: 2\.75rem/.test(upecCss) ||
                !upecCss.includes(".pw-header #question-title") ||
                !upecCss.includes("text-overflow: ellipsis") ||
                !upecCss.includes("transform: scale(1.15)") ||
                !upecCss.includes("transform-origin: top left") ||
                !upecCss.includes("center / 100% 100% no-repeat") ||
                /\.pw-header\s*\{[^}]*padding\s*:/s.test(questionCss)) {
              throw new Error("Le logo UPEC recoloré ou son style plein bandeau est absent.");
            }
          });
          test("les styles standards sont ciblés et conservent l’animation du retour", () => {
            if (questionCss.includes(".dev_exos") ||
                !questionCss.includes("@keyframes growIn")) {
              throw new Error("Des styles historiques inutiles subsistent ou l’animation du retour est absente.");
            }
          });
          test("les crochets matriciels utilisent des angles droits", () => {
            if (!questionCss.includes(".pw-matrix-delimiter {") ||
                !questionCss.includes("border-top: 2px solid var(--pw-input-border)") ||
                !questionCss.includes("border-bottom: 2px solid var(--pw-input-border)") ||
                !questionCss.includes(".pw-matrix-delimiter-left {") ||
                !questionCss.includes("border-left: 2px solid var(--pw-input-border)") ||
                !questionCss.includes(".pw-matrix-delimiter-right {") ||
                !questionCss.includes("border-right: 2px solid var(--pw-input-border)")) {
              throw new Error("Les délimiteurs de matrice ne forment pas des crochets droits.");
            }
          });
          test("les matrices gardent le même espacement horizontal et vertical", () => {
            if (!/\.pw-matrix\s*\{[^}]*border-spacing:\s*0\.2em/s.test(questionCss) ||
                !/\.pw-vmatrix-grid\s*\{[^}]*gap:\s*0\.2em/s.test(questionCss)) {
              throw new Error("L’espacement horizontal et vertical diffère entre les cases matricielles.");
            }
          });
          // L’ordre des animations (champ, puis retour) est vérifié en situation dans runtime-tests.html.
          test("le retour conserve son animation et sa variante sans mouvement", () => {
            if (!questionCss.includes("animation: growIn 2.5s forwards") ||
                !questionCss.includes("animation: feedbackFadeIn 1s")) {
              throw new Error("L’animation du retour ou sa variante pour les mouvements réduits est absente.");
            }
          });
          test("le composant de réponse réserve sa largeur pendant l’animation du retour", () => {
            if (!inputWidget.includes("class=\"input pw-input phantom\"") ||
                !questionCss.includes(".phantom {")) {
              throw new Error("Le composant de réponse ne possède pas de champ fantôme préservant la mise en page.");
            }
          });
          test("le runtime gère les dimensions matricielles carrées et rectangulaires", () => {
            const square = PyWimsTemplate.parseTag("input_matrix 'a' size=3 solution=s");
            const rectangular = PyWimsTemplate.parseTag("input_matrix 'b' rows=m cols=2 input_style='width:2em' solution=s");
            const variables = PyWimsTemplate.templateVariables(
              "{{ A }} {% input_matrix 'a' size=n solution=s %} {% input_matrix 'b' rows=m cols=p solution=s %} {% input_matrix 'c' size=2 solution=s %}"
            );
            if (square.attributes.size !== 3 ||
                rectangular.attributes.rows !== "m" ||
                rectangular.attributes.cols !== 2 ||
                [...variables].sort().join(",") !== "A,m,n,p") {
              throw new Error("Les dimensions littérales ou nommées des matrices sont mal analysées.");
            }
            for (const invalid of [
              "input_matrix 'a' solution=s",
              "input_matrix 'a' rows=2 solution=s",
              "input_matrix 'a' size=2 rows=2 cols=2 solution=s"
            ]) {
              let rejected = false;
              try {
                PyWimsTemplate.parseTag(invalid);
              } catch (error) {
                rejected = error.message.includes("exige soit size, soit rows et cols");
              }
              if (!rejected) throw new Error(`Dimensions incohérentes acceptées : ${invalid}`);
            }
          });
          // Modèle d’une question, tel que question.js le recopie dans chaque section.
          const questionTemplate = new DOMParser().parseFromString(layout, "text/html")
            .getElementById("pw-question-template")?.content;
          test("un élément de statut vide ne crée pas de bandeau de validation", () => {
            const status = questionTemplate?.querySelector('[data-role="status"]');
            if (!status || !status.hidden || status.getAttribute("role") !== "status" ||
                status.closest(".validation-statement") || status.classList.contains("validation-statement")) {
              throw new Error("L’élément de statut vide est absent ou stylé comme un bandeau de validation.");
            }
          });
          test("la mise en page porte le titre et le modèle de question a les trois actions", () => {
            if (!layout.includes('<h1 id="question-title">@@TITLE@@</h1>') ||
                ["check", "solution", "new-draw", "prompt", "feedback", "title"]
                  .some(role => !questionTemplate?.querySelector(`[data-role="${role}"]`)) ||
                questionTemplate.querySelector("[id]")) {
              throw new Error("Le titre, un élément du modèle de question manque, ou le modèle porte un identifiant fixe.");
            }
          });
        })
      .catch(error => {
        const item = document.createElement("li");
        item.textContent = `ÉCHEC : vérification des ressources de mise en page — ${error.message}`;
        item.style.color = "red";
        results.append(item);
      }));
    Promise.allSettled(pendingTests).then(() => { document.body.dataset.done = "true"; });
  </script>
</body>
