<!doctype html>
<!-- Maquette de la feuille d’exercices (activité) et de la question seule.
     Aucune exécution Python : la correction des exemples est simulée en JavaScript,
     uniquement pour juger la mise en page, les états et les animations. -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Feuille d’entraînement PyWims</title>
  <!-- La maquette utilise directement la charte et les styles réels du projet. -->
  <link rel="stylesheet" href="../css/brand.css">
  <link rel="stylesheet" href="../css/exercise.css">
  <style>
    /* Teintes dérivées de la charte, sans nouvelle couleur propre à la maquette. */
    :root {
      --pw-progress-track: color-mix(in srgb, #fff 35%, var(--pw-brand-primary));
      --pw-primary-soft: color-mix(in srgb, var(--pw-brand-navy) 8%, #fff);
    }

    [hidden] { display: none !important; }

    /* Barre propre à la maquette : elle ne fait pas partie du design proposé. */
    .mockup-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.4rem 0.75rem;
      padding: 0.45rem 1rem;
      color: #ddd;
      background: #2b2b2b;
      font: 13px/1.3 system-ui, sans-serif;
    }
    .mockup-bar strong { color: #fff; }
    .mockup-bar button {
      padding: 0.2rem 0.75rem;
      border: 1px solid #777;
      border-radius: 999px;
      color: #eee;
      background: transparent;
      font: inherit;
      cursor: pointer;
    }
    .mockup-bar button[aria-pressed="true"] { color: #222; background: #eee; }
    .mockup-group { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 0.35rem; }

    /* En-tête collant : titre, complétion, bouton global et logo. */
    .pw-sticky { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; }
    .pw-sticky .pw-header { margin: 0; }
    .pw-header h1 {
      min-width: 0;
      overflow: hidden;
      font-size: clamp(14pt, 2.4vw, 22pt);
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .pw-header-tools {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 1rem;
      margin-left: auto;
      color: #fff;
    }
    .pw-completion { display: grid; justify-items: end; font-family: var(--pw-heading-font); line-height: 1.05; }
    .pw-completion-value { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .pw-completion-label { font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase; opacity: 0.9; }
    .pw-progress { height: 6px; background: var(--pw-progress-track); }
    .pw-progress-fill {
      width: 0;
      height: 100%;
      background: var(--pw-correct-text);
      transition: width 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .pw-check-all {
      padding: 0.4rem 0.95rem;
      border: 2px solid #fff;
      border-radius: 8px;
      color: var(--pw-brand-primary);
      background: #fff;
      font: 600 0.95rem var(--pw-body-font);
      cursor: pointer;
    }

    /* Feuille d’exercices compacte : une carte par question. */
    .view-activity { min-height: 100vh; background: var(--pw-action-background); }
    .pw-sheet {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 0.75rem;
      max-width: 72rem;
      margin: 0 auto;
      padding: 1rem clamp(0.6rem, 2vw, 1.5rem) 2rem;
    }
    .pw-q {
      display: grid;
      grid-template-columns: 2.25rem minmax(0, 1fr) minmax(14rem, 19rem);
      grid-template-areas:
        "badge head head"
        "badge enonce feedback"
        ". actions actions";
      gap: 0.35rem 1rem;
      padding: 0.8rem 1rem;
      border: 1px solid var(--pw-action-border);
      border-left: 5px solid var(--pw-action-border);
      border-radius: 10px;
      background: #fff;
      transition: border-color 0.5s;
    }
    .pw-q[data-result="ok"] { border-left-color: var(--pw-correct-text); }
    .pw-q[data-result="ko"] { border-left-color: var(--pw-incorrect-text); }
    .pw-q[data-state="solution"] { border-left-color: var(--pw-brand-navy); }
    .pw-q-badge {
      display: grid;
      grid-area: badge;
      width: 2.25rem;
      height: 2.25rem;
      place-items: center;
      border: 2px solid var(--pw-action-border);
      border-radius: 50%;
      color: var(--pw-brand-tertiary);
      background: var(--pw-action-background);
      font: 700 1rem var(--pw-heading-font);
      transition: background 0.4s, border-color 0.4s, color 0.4s;
    }
    .pw-q-badge.is-done { border-color: var(--pw-correct-text); color: #fff; background: var(--pw-correct-text); }
    .pw-q-head {
      display: flex;
      grid-area: head;
      min-width: 0;
      min-height: 2.25rem;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .pw-q-title { margin: 0; color: var(--pw-brand-navy); font: 700 1rem var(--pw-heading-font); }
    .pw-q-enonce { grid-area: enonce; min-width: 0; font-size: 12pt; line-height: 1.6; overflow-wrap: anywhere; }
    .pw-center { text-align: center; }

    /* Emplacement du retour réservé en permanence : son affichage ne déplace rien. */
    .pw-q-slot {
      position: relative;
      grid-area: feedback;
      min-height: 5.5rem;
    }
    /* Le retour est superposé à son emplacement : un texte long défile au lieu d’agrandir la carte. */
    .pw-q-slot > .feedback {
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      max-height: 100%;
      overflow: auto;
      padding: 0.8em;
      border-radius: 8px;
    }
    .pw-feedback.is-static { opacity: 1; }

    /* Les trois boutons gardent toujours leur place ; un bouton absent reste invisible. */
    .pw-q-actions { display: flex; grid-area: actions; flex-wrap: wrap; justify-content: flex-end; gap: 0.5rem; }
    .pw-act.is-absent { visibility: hidden; }

    /* Variante A : bandeau et boutons au style PyWims (champ arrondi, italique). */
    .pw-act {
      display: inline-flex;
      align-items: center;
      gap: 0.4em;
      padding: 0.2em 0.85em;
      border: 2px solid var(--pw-input-border);
      border-radius: 8px;
      color: var(--pw-text-color);
      background: #fff;
      font: italic 12pt var(--pw-body-font);
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s, opacity 0.2s;
    }
    .pw-act:hover:not(:disabled) { border-color: var(--pw-brand-navy); color: var(--pw-brand-navy); }
    .pw-act.is-primary { border-color: var(--pw-brand-navy); color: var(--pw-brand-navy); font-weight: 700; }
    .pw-act:disabled { cursor: not-allowed; opacity: 0.4; }
    .pw-act:focus-visible { outline: 3px solid color-mix(in srgb, var(--pw-brand-navy) 40%, transparent); outline-offset: 2px; }
    .pw-act svg { display: none; width: 1.05em; height: 1.05em; flex: 0 0 auto; }
    .variant-a .pw-q .pw-q-actions {
      margin-top: 0.3rem;
      padding: 0.3em;
      border-bottom: 1px solid var(--pw-action-border);
      border-radius: 6px;
      background: var(--pw-action-background);
    }

    /* Le libellé du bouton principal réserve la largeur de « Corriger ma réponse ». */
    .pw-swap { display: inline-grid; }
    .pw-swap > span { grid-area: 1 / 1; text-align: center; }
    .pw-swap > span.is-off { visibility: hidden; }

    /* Variante B : barre d’outils discrète, avec icônes, dans l’en-tête de la question. */
    .variant-b .pw-q { grid-template-areas: "badge head head" "badge enonce feedback"; }
    .variant-b .pw-act {
      padding: 0.35em 0.6em;
      border: 0;
      border-radius: 6px;
      color: var(--pw-brand-tertiary);
      background: transparent;
      font: 600 0.9rem var(--pw-body-font);
    }
    .variant-b .pw-act:hover:not(:disabled) { color: var(--pw-brand-navy); background: var(--pw-action-background); }
    .variant-b .pw-act.is-primary { color: var(--pw-brand-navy); background: var(--pw-primary-soft); }
    .variant-b .pw-act svg { display: inline-block; }
    .variant-b .pw-q-head .pw-q-actions { flex-wrap: nowrap; gap: 0.25rem; }

    /* Champs de réponse : la bordure reprend aussi la couleur de correction. */
    .pw-q .input, .pw-single .input { padding: 0.2em 0.45em; }
    .pw-input.is-correct { border-color: var(--pw-correct-text); }
    .pw-input.is-incorrect { border-color: var(--pw-incorrect-text); }
    .pw-matrix .pw-input { width: 2.6em; text-align: center; }
    .pw-math-input { min-width: min(14rem, 100%); }

    /* Question laissée vide lors de « Tout vérifier » : léger signal visuel. */
    .is-nudged { animation: nudge 0.6s ease-in-out; }
    @keyframes nudge {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(5px); }
      60% { transform: translateX(-3px); }
      80% { transform: translateX(2px); }
    }

    .pw-toast {
      position: fixed;
      top: 6.5rem;
      left: 50%;
      z-index: 80;
      padding: 0.5rem 1.1rem;
      border-radius: 999px;
      color: #fff;
      background: var(--pw-correct-text);
      box-shadow: 0 6px 20px #0003;
      font: 600 0.95rem var(--pw-body-font);
      pointer-events: none;
      transform: translateX(-50%);
    }
    .pw-confetti { position: fixed; top: -12px; z-index: 90; width: 9px; height: 14px; border-radius: 2px; pointer-events: none; }

    .pw-bottom-bar { display: none; }

    /* Question seule : mise en page PyWims classique, retour sous la question. */
    .view-single { min-height: 100vh; background: #fff; }
    .pw-single .validation-enonce { display: flex; margin-top: 1em; }
    .pw-single .pw-q-slot { min-height: 3.5rem; margin: 0.75rem 2em 0; }

    /* Un retour invisible ne doit jamais intercepter les touchers destinés aux champs. */
    .pw-feedback:not(.is-visible):not(.is-static) { pointer-events: none; }
    .pw-feedback.is-dismissed { opacity: 0 !important; pointer-events: none; animation: none; }

    @media (max-width: 820px) {
      .pw-q, .variant-b .pw-q {
        grid-template-columns: 2.25rem minmax(0, 1fr);
        grid-template-areas: "badge head" "badge enonce" ". feedback" ". actions";
      }
      /* Mode « réservé » : l’emplacement du retour est toujours présent sous l’énoncé. */
      .fb-reserved .pw-q-slot { height: 5.5rem; }

      /* Mode « agrandissement » : la carte s’agrandit en douceur à l’apparition du retour. */
      .fb-grow .pw-q-slot {
        height: var(--fb-h, 0px);
        min-height: 0;
        overflow: hidden;
        transition: height 0.35s ease;
      }
      .fb-grow .pw-q-slot > .feedback { position: static; max-height: none; }

      /* Mode « bulle » : le retour flotte sous le champ concerné, sans rien déplacer. */
      .fb-bubble .pw-q, .fb-bubble .pw-single { position: relative; }
      .fb-bubble .pw-q-slot { position: static; height: 0; min-height: 0; }
      .fb-bubble .pw-q-slot > .feedback {
        top: var(--by, 3rem);
        right: auto;
        left: var(--bx, 1rem);
        z-index: 20;
        width: var(--bw, 18rem);
        max-height: none;
        overflow: visible;
        box-shadow: 0 8px 24px #0003;
        transform-origin: var(--ax, 1.5rem) 0;
        cursor: pointer;
      }
      .fb-bubble .pw-q-slot > .feedback::before {
        position: absolute;
        top: -6px;
        left: var(--ax, 1.5rem);
        width: 12px;
        height: 12px;
        background: inherit;
        content: "";
        transform: rotate(45deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .fb-grow .pw-q-slot { transition: none; }
    }

    @media (max-width: 640px) {
      .pw-header-tools .pw-check-all { display: none; }
      .pw-completion-label { display: none; }
      .pw-completion-value { font-size: 1.25rem; }
      .pw-bottom-bar {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 60;
        display: block;
        padding: 0.6rem 1rem calc(0.6rem + env(safe-area-inset-bottom, 0px));
        border-top: 1px solid var(--pw-action-border);
        background: #ffffffeb;
        backdrop-filter: blur(6px);
      }
      .pw-bottom-bar .pw-check-all { width: 100%; border-color: var(--pw-brand-navy); color: #fff; background: var(--pw-brand-navy); }
      .pw-sheet { padding-bottom: 5.5rem; }
      .pw-q, .variant-b .pw-q { grid-template-columns: 1.9rem minmax(0, 1fr); gap: 0.3rem 0.6rem; padding: 0.7rem; }
      .pw-q-badge { width: 1.9rem; height: 1.9rem; font-size: 0.9rem; }
      .variant-b .pw-act .pw-act-label { display: none; }
      .variant-a .pw-act { font-size: 11pt; padding: 0.2em 0.6em; }
      .pw-toast { top: 4.5rem; }
      .form-enonce { margin-right: 0.75em; margin-left: 0.75em; }
      .pw-single .pw-q-slot { margin-right: 0.75em; margin-left: 0.75em; }
    }
  </style>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["$", "$"], ["\\(", "\\)"]],
        displayMath: [["$$", "$$"], ["\\[", "\\]"]],
        processEscapes: true
      },
      startup: { typeset: false }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"></script>
  <script async src="https://unpkg.com/mathlive@0.111.0"></script>
</head>
<body class="variant-b fb-grow">
  <div class="mockup-bar">
    <strong>Maquette</strong>
    <span class="mockup-group">
      Vue :
      <button type="button" data-view="activity" aria-pressed="true">Activité</button>
      <button type="button" data-view="single" aria-pressed="false">Question seule</button>
    </span>
    <span class="mockup-group">
      Retour sur téléphone :
      <button type="button" data-feedback="reserved" aria-pressed="false">Réservé</button>
      <button type="button" data-feedback="bubble" aria-pressed="false">Bulle</button>
      <button type="button" data-feedback="grow" aria-pressed="true">Agrandissement (retenu)</button>
    </span>
  </div>

  <!-- Vue « activité » : feuille d’exercices compacte. -->
  <div class="view-activity" id="view-activity">
    <div class="pw-sticky">
      <header class="pw-header">
        <h1 id="exercise-title">Calcul — feuille d’entraînement</h1>
        <div class="pw-header-tools">
          <div class="pw-completion" aria-live="polite">
            <span class="pw-completion-value" id="completion-value">0 %</span>
            <span class="pw-completion-label" id="completion-label">0 / 4 réussies</span>
          </div>
        </div>
        <span class="pw-brand-logo" aria-hidden="true"></span>
      </header>
      <div class="pw-progress" aria-hidden="true"><div class="pw-progress-fill" id="progress-fill"></div></div>
    </div>
    <div class="pw-sheet" id="sheet"></div>
  </div>

  <!-- Vue « question seule » : mise en page standard actuelle, enrichie. -->
  <div class="view-single" id="view-single" hidden>
    <header class="pw-header">
      <h1>Dérivée d’un polynôme</h1>
      <span class="pw-brand-logo" aria-hidden="true"></span>
    </header>
    <div class="pw-single" id="single"></div>
  </div>

  <script>
    // Préférences de mouvement : on remplace les animations par des changements directs.
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

    // Outils arithmétiques et LaTeX utilisés par les exemples simulés.
    const gcd = (a, b) => {
      a = Math.abs(a);
      b = Math.abs(b);
      while (b) [a, b] = [b, a % b];
      return a;
    };
    const frac = (n, d) => `\\frac{${n}}{${d}}`;
    const latexMatrix = M => `\\begin{bmatrix}${M.map(row => row.join(" & ")).join(" \\\\ ")}\\end{bmatrix}`;
    const matMul = (A, B) => A.map(row => B[0].map((_, j) => row.reduce((s, a, k) => s + a * B[k][j], 0)));

    function polyLatex(coeffs) {
      const n = coeffs.length - 1;
      let s = "";
      coeffs.forEach((c, i) => {
        const deg = n - i;
        if (c === 0) return;
        const abs = Math.abs(c);
        const coef = abs === 1 && deg > 0 ? "" : String(abs);
        const x = deg === 0 ? "" : deg === 1 ? "x" : `x^{${deg}}`;
        s += s ? ` ${c < 0 ? "-" : "+"} ${coef}${x}` : `${c < 0 ? "-" : ""}${coef}${x}`;
      });
      return s || "0";
    }

    // Évalue une saisie ASCII de MathLive comme fonction de x (simulation de la maquette seulement).
    function asciiFunction(text) {
      let s = String(text).replace(/\s+/g, "").replace(/[⋅·]/g, "*");
      if (!s || !/^[0-9x+\-*/^().]+$/.test(s)) return null;
      s = s.replace(/(\d|\))(?=[x(])/g, "$1*").replace(/x(?=[\dx(])/g, "x*");
      s = s.replace(/(^|[(*/+\-])-/g, "$1(0-1)*").replace(/\^/g, "**");
      try {
        const f = new Function("x", `return (${s});`);
        f(1);
        return f;
      } catch {
        return null;
      }
    }

    // Widgets de saisie, avec les classes réelles du projet.
    const textInput = (name, width, mode = "text") =>
      `<input class="input pw-input" data-name="${name}" type="text" inputmode="${mode}" autocomplete="off" style="width:${width}" aria-label="${name}">`;
    const mathInput = name =>
      `<math-field class="input pw-input pw-math-input" data-name="${name}" math-virtual-keyboard-policy="auto" aria-label="${name}"></math-field>`;
    const matrixInput = (name, rows, cols) =>
      `<span class="pw-matrix-frame"><span class="pw-matrix-delimiter pw-matrix-delimiter-left" aria-hidden="true"></span><table class="pw-matrix"><tbody>${
        Array.from({ length: rows }, (_, i) => `<tr>${
          Array.from({ length: cols }, (_, j) => `<td>${textInput(`${name}[${i}][${j}]`, "2.6em", "numeric")}</td>`).join("")
        }</tr>`).join("")
      }</tbody></table><span class="pw-matrix-delimiter pw-matrix-delimiter-right" aria-hidden="true"></span></span>`;

    // Les quatre exercices réels du dépôt, avec trois tirages précalculés chacun.
    // « answers » donne, pour chaque champ, la valeur qui remplit le champ quand on demande la solution.
    const specs = {
      fractions: {
        title: "Addition de fractions",
        draws: [[3, 4, 5, 6], [2, 5, 3, 4], [5, 3, 2, 5]],
        enonce: ([n, m, p, q]) =>
          `Additionnez ces fractions et donnez le résultat sous forme d’une fraction irréductible, avec un dénominateur positif :<br>$\\displaystyle ${frac(n, m)} + ${frac(p, q)} =$ ${textInput("resultat", "7em")}`,
        answers([n, m, p, q]) {
          const L = m * q / gcd(m, q);
          const s = n * L / m + p * L / q;
          const g = gcd(s, L);
          return { resultat: `${s / g}/${L / g}` };
        },
        check(draw, v) {
          const [expectedN, expectedD] = this.answers(draw).resultat.split("/").map(Number);
          const match = v.resultat.trim().match(/^(-?\d+)\s*(?:\/\s*(\d+))?$/);
          const ko = feedback => ({ ok: { resultat: false }, feedback });
          if (!match) return ko("Saisissez une fraction d’entiers, par exemple 7/12.");
          const a = Number(match[1]);
          const b = match[2] === undefined ? 1 : Number(match[2]);
          if (b === 0) return ko("Le dénominateur ne peut pas être nul.");
          if (a * expectedD !== b * expectedN) return ko("Ce n’est pas la bonne somme. Avez-vous réduit les deux fractions au même dénominateur ?");
          if (gcd(a, b) !== 1) return ko(`La valeur est juste, mais la fraction n’est pas irréductible : simplifiez par ${gcd(a, b)}.`);
          return { ok: { resultat: true }, feedback: "Bravo, c’est exact !" };
        }
      },
      derivee: {
        title: "Dérivée d’un polynôme",
        draws: [[2, -3, 1, -5], [-1, 4, 0, 2], [3, 0, -4, 1]],
        enonce: c => `Soit la fonction polynomiale $f(x) = ${polyLatex(c)}$.<br>Donnez sa dérivée $f'(x)$ : ${mathInput("derivee_eleve")}`,
        answers: ([a, b, c]) => ({ derivee_eleve: polyLatex([3 * a, 2 * b, c]) }),
        check([a, b, c, d], v) {
          const f = asciiFunction(v.derivee_eleve);
          const ko = feedback => ({ ok: { derivee_eleve: false }, feedback });
          if (!f) return ko("Expression non reconnue : vérifiez votre saisie.");
          const close = (g, h) => [-1.7, 0.4, 1.3, 2.9].every(x => Math.abs(g(x) - h(x)) < 1e-9 * (1 + Math.abs(h(x))));
          if (close(f, x => 3 * a * x * x + 2 * b * x + c)) {
            return { ok: { derivee_eleve: true }, feedback: "Bravo, cette dérivée est correcte !" };
          }
          if (close(f, x => a * x ** 3 + b * x * x + c * x + d)) return ko("Vous avez recopié la fonction au lieu de la dériver.");
          if (d !== 0 && close(f, x => 3 * a * x * x + 2 * b * x + c + d)) return ko("Presque : la dérivée d’une constante est nulle.");
          return ko("Ce n’est pas la bonne dérivée. Dérivez terme à terme avec $(x^n)' = n\\,x^{n-1}$.");
        }
      },
      matrices: {
        title: "Produit de matrices",
        draws: [
          { A: [[1, 0, -1], [0, 1, 1]], B: [[1, -1], [0, 1], [1, 0]] },
          { A: [[1, 1], [0, -1]], B: [[1, 0], [1, 1]] },
          { A: [[2, -1]], B: [[1, 0], [1, 1]] }
        ],
        enonce: ({ A, B }) =>
          `Calculez le produit des matrices suivantes :$$A = ${latexMatrix(A)},\\quad B = ${latexMatrix(B)}.$$<div class="pw-center">$AB = $ ${matrixInput("matrice", A.length, B[0].length)}</div>`,
        answers({ A, B }) {
          const values = {};
          matMul(A, B).forEach((row, i) => row.forEach((value, j) => { values[`matrice[${i}][${j}]`] = String(value); }));
          return values;
        },
        check(draw, v) {
          const expected = this.answers(draw);
          const ok = {};
          let wrong = 0;
          for (const [name, value] of Object.entries(expected)) {
            ok[name] = /^\s*-?\d+\s*$/.test(v[name]) && Number(v[name]) === Number(value);
            if (!ok[name]) wrong += 1;
          }
          const total = Object.keys(expected).length;
          return {
            ok,
            feedback: wrong === 0
              ? "Bravo, le produit des matrices est correct !"
              : `${wrong} coefficient${wrong > 1 ? "s" : ""} sur ${total} ${wrong > 1 ? "sont incorrects" : "est incorrect"}.`
          };
        }
      },
      pgcd: {
        title: "PGCD",
        draws: [[84, 36], [126, 48], [75, 45]],
        enonce: ([x, y]) => `Quel est le plus grand diviseur commun de $${x}$ et $${y}$ ?<br>Réponse : ${textInput("reponse", "5em", "numeric")}`,
        answers: ([x, y]) => ({ reponse: String(gcd(x, y)) }),
        check([x, y], v) {
          const ko = feedback => ({ ok: { reponse: false }, feedback });
          if (!/^\s*\d+\s*$/.test(v.reponse)) return ko("Saisissez un nombre entier positif.");
          const r = Number(v.reponse);
          if (r === gcd(x, y)) return { ok: { reponse: true }, feedback: "Bravo, c’est exact !" };
          if (r > 0 && x % r === 0 && y % r === 0) return ko(`$${r}$ est bien un diviseur commun de $${x}$ et $${y}$, mais ce n’est pas le plus grand.`);
          return ko(`$${r}$ ne divise pas $${r > 0 && x % r !== 0 ? x : y}$.`);
        }
      }
    };

    // Icônes au trait des boutons de la variante B.
    const icons = {
      check: '<path d="M4 12.5l5 5L20 6.5"/>',
      fix: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
      solution: '<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',
      redraw: '<path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 3v5h5"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 21v-5h-5"/>'
    };
    const svg = name => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]}</svg>`;

    // Attend MathJax puis compose les formules de l’élément donné.
    function mathJaxReady() {
      return new Promise(resolve => {
        const poll = () => window.MathJax?.startup?.promise
          ? window.MathJax.startup.promise.then(resolve)
          : setTimeout(poll, 50);
        poll();
      });
    }
    async function typeset(element) {
      await mathJaxReady();
      MathJax.typesetClear([element]);
      await MathJax.typesetPromise([element]);
    }

    // Réduit le champ, applique le changement à mi-parcours, puis le réagrandit avec un léger rebond.
    // L’animation n’utilise que des transformations : la mise en page ne bouge jamais.
    async function flipField(field, delay, change) {
      if (reduceMotion) {
        change();
        return;
      }
      await wait(delay);
      const out = field.animate(
        [{ transform: "scaleX(1)", opacity: 1 }, { transform: "scaleX(0)", opacity: 0 }],
        { duration: 260, easing: "ease-in", fill: "forwards" }
      );
      await out.finished;
      change();
      const back = field.animate(
        [
          { transform: "scaleX(0)", opacity: 0 },
          { transform: "scaleX(1.08)", opacity: 1, offset: 0.7 },
          { transform: "scaleX(1)", opacity: 1 }
        ],
        { duration: 380, easing: "ease-out", fill: "forwards" }
      );
      await back.finished;
      out.cancel();
      back.cancel();
    }

    function pop(element) {
      if (!reduceMotion) {
        element.animate(
          [{ transform: "scale(0.3)" }, { transform: "scale(1.3)", offset: 0.6 }, { transform: "scale(1)" }],
          { duration: 500, easing: "ease-out" }
        );
      }
    }

    function toast(text) {
      const element = document.createElement("div");
      element.className = "pw-toast";
      element.textContent = text;
      document.body.append(element);
      element.animate(
        [
          { opacity: 0, transform: "translate(-50%, -10px)" },
          { opacity: 1, transform: "translate(-50%, 0)", offset: 0.15 },
          { opacity: 1, transform: "translate(-50%, 0)", offset: 0.85 },
          { opacity: 0, transform: "translate(-50%, -10px)" }
        ],
        { duration: 2600 }
      ).finished.then(() => element.remove());
    }

    function fieldValue(field) {
      return field.matches("math-field") ? field.getValue("ascii-math") : field.value;
    }

    // Une question : tirage courant, état et transitions de son cycle de vie.
    //   open     : saisie libre — Vérifier (grisé tant que rien n’est saisi), Solution, Nouvel énoncé
    //   checked  : retour affiché — Corriger ma réponse (si erreur), Solution (si erreur), Nouvel énoncé
    //   solution : tous les champs remplis en vert — Nouvel énoncé seulement
    class Question {
      constructor(container, spec, { index, mode, onChange }) {
        this.spec = spec;
        this.mode = mode;
        this.onChange = onChange;
        this.drawIndex = 0;
        this.done = false;
        this.root = document.createElement(mode === "activity" ? "article" : "div");
        const actions = `<div class="pw-q-actions" data-role="actions">
            <button type="button" class="pw-act is-primary" data-act="primary">${svg("check")}<span class="pw-act-label pw-swap"><span data-label="check">Vérifier ma réponse</span><span data-label="fix" class="is-off">Corriger ma réponse</span></span></button>
            <button type="button" class="pw-act" data-act="solution">${svg("solution")}<span class="pw-act-label">Solution</span></button>
            <button type="button" class="pw-act" data-act="redraw">${svg("redraw")}<span class="pw-act-label">Nouvel énoncé</span></button>
          </div>`;
        this.root.innerHTML = mode === "activity"
          ? `<div class="pw-q-badge" data-role="badge">${index + 1}</div>
             <div class="pw-q-head" data-role="head"><h2 class="pw-q-title">${spec.title}</h2></div>
             <div class="pw-q-enonce" data-role="enonce"></div>
             <div class="pw-q-slot"><div class="feedback pw-feedback" data-role="feedback" aria-live="polite"></div></div>
             ${actions}`
          : `<main class="form-enonce" data-role="enonce"></main>
             <div class="validation-enonce">${actions}</div>
             <div class="pw-q-slot"><div class="feedback pw-feedback" data-role="feedback" aria-live="polite"></div></div>`;
        if (mode === "activity") this.root.className = "pw-q";
        for (const role of ["badge", "head", "enonce", "actions", "feedback"]) {
          this[role] = this.root.querySelector(`[data-role="${role}"]`);
        }
        this.buttons = Object.fromEntries(
          [...this.root.querySelectorAll("[data-act]")].map(button => [button.dataset.act, button])
        );
        this.buttons.primary.addEventListener("click", () => (this.state === "open" ? this.check() : this.correct()));
        this.buttons.solution.addEventListener("click", () => this.showSolution());
        this.buttons.redraw.addEventListener("click", () => this.newDraw());
        this.enonce.addEventListener("input", () => this.renderActions());
        // En mode « bulle », toucher le retour le referme.
        this.feedback.addEventListener("click", () => {
          if (document.body.classList.contains("fb-bubble")) this.feedback.classList.add("is-dismissed");
        });
        container.append(this.root);
      }

      get draw() { return this.spec.draws[this.drawIndex]; }
      get fields() { return [...this.enonce.querySelectorAll("[data-name]")]; }
      openFields() { return this.fields.filter(field => !field.classList.contains("is-correct")); }
      hasInput() { return this.openFields().some(field => fieldValue(field).trim()); }

      // Range les boutons dans le bandeau (variante A) ou dans l’en-tête (variante B).
      placeActions(variant) {
        if (this.mode !== "activity") return;
        if (variant === "b") this.head.append(this.actions);
        else this.root.append(this.actions);
      }

      setState(state, result = null) {
        this.state = state;
        this.result = result;
        this.root.dataset.state = state;
        if (result) this.root.dataset.result = result;
        else delete this.root.dataset.result;
        this.renderActions();
      }

      // Seuls la visibilité et les libellés changent : les boutons ne se déplacent jamais.
      renderActions() {
        const { primary, solution, redraw } = this.buttons;
        const failed = this.state === "checked" && this.result === "ko";
        const showPrimary = this.state === "open" || failed;
        primary.classList.toggle("is-absent", !showPrimary);
        solution.classList.toggle("is-absent", !(this.state === "open" || failed));
        redraw.classList.remove("is-absent");
        const fixing = failed;
        primary.querySelector('[data-label="check"]').classList.toggle("is-off", fixing);
        primary.querySelector('[data-label="fix"]').classList.toggle("is-off", !fixing);
        primary.querySelector("svg").innerHTML = icons[fixing ? "fix" : "check"];
        primary.setAttribute("aria-label", fixing ? "Corriger ma réponse" : "Vérifier ma réponse");
        primary.disabled = this.state === "open" && !this.hasInput();
        for (const button of [primary, solution, redraw]) {
          button.tabIndex = button.classList.contains("is-absent") ? -1 : 0;
        }
      }

      // Le tirage le plus haut fixe la hauteur minimale : un nouvel énoncé ne fait jamais rétrécir la carte.
      async render() {
        this.enonce.innerHTML = this.spec.enonce(this.draw);
        this.hideFeedback();
        this.setState("open");
        await typeset(this.enonce);
        const height = this.enonce.getBoundingClientRect().height;
        this.minHeight = Math.max(this.minHeight || 0, height);
        this.enonce.style.minHeight = `${this.minHeight}px`;
      }

      values() {
        return Object.fromEntries(this.fields.map(field => [field.dataset.name, fieldValue(field)]));
      }

      setField(field, value) {
        if (field.matches("math-field")) field.value = value;
        else field.value = value;
      }

      async showFeedback(html, ok, animate) {
        const element = this.feedback;
        element.classList.remove("is-visible", "is-static", "is-correct", "is-incorrect", "is-dismissed");
        element.innerHTML = html;
        element.classList.add(ok ? "is-correct" : "is-incorrect");
        void element.offsetWidth;
        element.classList.add(animate && !reduceMotion ? "is-visible" : "is-static");
        this.layoutFeedback();
        await typeset(element);
        this.layoutFeedback();
      }

      hideFeedback() {
        this.feedback.classList.remove("is-visible", "is-static", "is-correct", "is-incorrect", "is-dismissed");
        this.feedback.innerHTML = "";
        this.layoutFeedback();
      }

      // Calcule la hauteur du mode « agrandissement » et la position du mode « bulle ».
      layoutFeedback() {
        const slot = this.feedback.parentElement;
        const shown = this.feedback.classList.contains("is-correct") || this.feedback.classList.contains("is-incorrect");
        slot.style.setProperty("--fb-h", shown ? `${this.feedback.offsetHeight}px` : "0px");
        if (!shown) return;
        const anchor = this.fields.find(field => field.classList.contains("is-incorrect")) || this.fields.at(-1);
        if (!anchor) return;
        const box = this.root.getBoundingClientRect();
        const field = anchor.getBoundingClientRect();
        const width = Math.min(288, box.width - 24);
        const left = Math.max(12, Math.min(field.left - box.left, box.width - width - 12));
        this.root.style.setProperty("--bw", `${width}px`);
        this.root.style.setProperty("--bx", `${left}px`);
        this.root.style.setProperty("--by", `${field.bottom - box.top + 10}px`);
        this.root.style.setProperty("--ax", `${Math.max(10, Math.min(field.left - box.left - left + 14, width - 24))}px`);
      }

      async check({ animate = true } = {}) {
        if (this.state !== "open" || !this.hasInput()) return;
        const result = this.spec.check(this.draw, this.values());
        const allOk = Object.values(result.ok).every(Boolean);
        this.busy(true);
        const targets = this.openFields();
        targets.forEach(field => { field.readOnly = true; });
        await Promise.all(targets.map((field, i) => {
          const className = result.ok[field.dataset.name] ? "is-correct" : "is-incorrect";
          const change = () => field.classList.add(className);
          return animate ? flipField(field, i * 90, change) : change();
        }));
        await this.showFeedback(result.feedback, allOk, animate);
        this.busy(false);
        this.setState("checked", allOk ? "ok" : "ko");
        if (allOk && !this.done) {
          this.done = true;
          if (this.badge) {
            this.badge.classList.add("is-done");
            this.badge.textContent = "✓";
            if (animate) pop(this.badge);
          }
        }
        this.onChange?.();
      }

      // Retour à la saisie sur le même tirage : seuls les champs faux sont rouverts.
      correct() {
        for (const field of this.openFields()) {
          field.classList.remove("is-incorrect");
          field.readOnly = false;
        }
        this.hideFeedback();
        this.setState("open");
        this.openFields()[0]?.focus();
      }

      // La solution remplit chaque champ avec la bonne réponse, qui passe au vert.
      async showSolution({ animate = true } = {}) {
        const answers = this.spec.answers(this.draw);
        this.busy(true);
        this.hideFeedback();
        const targets = this.openFields().concat(this.fields.filter(field => field.classList.contains("is-incorrect")));
        await Promise.all([...new Set(targets)].map((field, i) => {
          const change = () => {
            field.classList.remove("is-incorrect");
            field.classList.add("is-correct");
            this.setField(field, answers[field.dataset.name]);
            field.readOnly = true;
          };
          return animate ? flipField(field, i * 90, change) : change();
        }));
        this.busy(false);
        this.setState("solution");
      }

      // Nouveau tirage précalculé : instantané, sans Python ni rechargement de la page.
      async newDraw() {
        if (!reduceMotion) {
          await this.enonce.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 150 }).finished;
        }
        this.drawIndex = (this.drawIndex + 1) % this.spec.draws.length;
        await this.render();
        if (!reduceMotion) {
          this.enonce.animate(
            [{ opacity: 0, transform: "translateY(6px)" }, { opacity: 1, transform: "none" }],
            { duration: 280, easing: "ease-out" }
          );
        }
      }

      // Pendant une animation, les boutons sont inactifs mais restent en place.
      busy(on) {
        for (const button of Object.values(this.buttons)) button.disabled = on;
        if (!on) this.renderActions();
      }

      nudge() {
        this.root.classList.remove("is-nudged");
        void this.root.offsetWidth;
        this.root.classList.add("is-nudged");
      }

      prefill(values) {
        for (const field of this.fields) {
          if (values[field.dataset.name] !== undefined) this.setField(field, values[field.dataset.name]);
        }
        this.renderActions();
      }
    }

    // Complétion de la feuille : seule une vérification entièrement juste compte, et elle reste acquise.
    const sheetElement = document.getElementById("sheet");
    const completionValue = document.getElementById("completion-value");
    const completionLabel = document.getElementById("completion-label");
    const progressFill = document.getElementById("progress-fill");
    let shownPercent = 0;
    let celebrated = false;
    const questions = [];

    function updateCompletion() {
      const done = questions.filter(question => question.done).length;
      const percent = Math.round(done * 100 / questions.length);
      progressFill.style.width = `${percent}%`;
      completionLabel.textContent = `${done} / ${questions.length} réussie${done > 1 ? "s" : ""}`;
      const start = shownPercent;
      const startTime = performance.now();
      const step = now => {
        const t = reduceMotion ? 1 : Math.min(1, (now - startTime) / 800);
        shownPercent = Math.round(start + (percent - start) * (1 - (1 - t) ** 3));
        completionValue.textContent = `${shownPercent} %`;
        if (t < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
      if (percent === 100 && !celebrated) {
        celebrated = true;
        celebrate();
      }
    }

    function celebrate() {
      toast("Feuille terminée — bravo !");
      if (reduceMotion) return;
      const style = getComputedStyle(document.documentElement);
      const colors = ["--pw-brand-primary", "--pw-brand-navy", "--pw-correct-text", "--pw-brand-tertiary"]
        .map(name => style.getPropertyValue(name).trim());
      for (let i = 0; i < 70; i += 1) {
        const piece = document.createElement("span");
        piece.className = "pw-confetti";
        piece.style.left = `${Math.random() * 100}vw`;
        piece.style.background = colors[i % colors.length];
        document.body.append(piece);
        const drift = (Math.random() - 0.5) * 200;
        piece.animate(
          [
            { transform: "translate(0, 0) rotate(0deg)", opacity: 1 },
            { transform: `translate(${drift}px, 105vh) rotate(${Math.random() * 900}deg)`, opacity: 0.9 }
          ],
          { duration: 1800 + Math.random() * 1600, delay: Math.random() * 400, easing: "cubic-bezier(.2,.6,.4,1)" }
        ).finished.then(() => piece.remove());
      }
    }

    // Commandes de la maquette : choix de la vue et du mode de retour sur téléphone.
    let single;
    const relayout = () => [...questions, single].filter(Boolean).forEach(question => question.layoutFeedback());
    for (const button of document.querySelectorAll(".mockup-bar [data-feedback]")) {
      button.addEventListener("click", () => {
        document.body.classList.remove("fb-reserved", "fb-bubble", "fb-grow");
        document.body.classList.add(`fb-${button.dataset.feedback}`);
        for (const other of document.querySelectorAll(".mockup-bar [data-feedback]")) {
          other.setAttribute("aria-pressed", String(other === button));
        }
        relayout();
      });
    }
    addEventListener("resize", relayout);
    for (const button of document.querySelectorAll(".mockup-bar [data-view]")) {
      button.addEventListener("click", () => {
        const view = button.dataset.view;
        document.getElementById("view-activity").hidden = view !== "activity";
        document.getElementById("view-single").hidden = view !== "single";
        for (const other of document.querySelectorAll(".mockup-bar [data-view]")) {
          other.setAttribute("aria-pressed", String(other === button));
        }
      });
    }

    // Place chaque question dans un état représentatif : juste, fausse, vierge, solution affichée.
    async function start() {
      await Promise.race([customElements.whenDefined("math-field"), wait(8000)]);
      ["fractions", "derivee", "matrices", "pgcd"].forEach((key, index) => questions.push(
        new Question(sheetElement, specs[key], { index, mode: "activity", onChange: updateCompletion })
      ));
      questions.forEach(question => question.placeActions("b"));
      await Promise.all(questions.map(question => question.render()));

      questions[0].prefill({ resultat: "19/12" });
      await questions[0].check({ animate: false });
      questions[1].prefill({ derivee_eleve: "6x^2-3x+1" });
      await questions[1].check({ animate: false });
      questions[3].prefill({ reponse: "6" });
      await questions[3].check({ animate: false });
      await questions[3].showSolution({ animate: false });
      updateCompletion();

      single = new Question(document.getElementById("single"), specs.derivee, { index: 0, mode: "single" });
      single.drawIndex = 1;
      await single.render();
      single.prefill({ derivee_eleve: "-3x^2+8x+2" });
      await single.check({ animate: false });
    }
    start();
  </script>
</body>
</html>
